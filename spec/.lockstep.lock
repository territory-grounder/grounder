  "note": "Governed safety-critical source files hash-bound to their owning spec (BEH-7 / REQ-701..704). SCOPE (narrowed 2026-07-30, ADR-0013): the lock governs the SAFETY SPINE (core/{safety,actuate,risk,predict,verify,audit,screen,proposal,manifest,auth}), the EFFECT CHANNEL (modules/actuation), the MEASUREMENT PLANE (spec/025 surfaces, tools/shadowbench, tools/faultinjector) and the gate itself (tools/specvalidate), plus the two REQ-702-mandated singletons core/suppression/chain.go and core/schema/version.go — files where drift from spec is dangerous AND change is rare. It deliberately does NOT govern orchestration/plumbing (cmd/, temporal/, core/httpapi, core/db, ...): governing the repo's hottest files taxed every routine change with a spec-prose edit plus a full lock rewrite (24.8% of all commits were lock rewrites) while --restamp silently overwrote hashes, protecting nothing. `lockstep --check` recomputes each hash and fails CI on drift; `lockstep --restamp` refuses unless the owning spec changed in the same diff.",
