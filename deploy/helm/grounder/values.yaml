# Territory Grounder Helm chart — the single authoritative configuration contract (spec/009 REQ-907).
#
# Every rendered manifest draws exclusively from this file. There is no second hand-maintained config
# surface. This is the deploy-layer application of INV-15 (one authoritative definition).
#
# CREDENTIALS ARE NEVER LITERALS HERE (spec/009 REQ-904 / INV-13). This file carries only Secret
# *names*; the actual DSNs, passwords, master key, and provider API keys live in a referenced
# Kubernetes Secret (secrets.mode=reference) or are resolved by the External Secrets Operator
# (secrets.mode=external). The CI gate greps the rendered output and fails on any literal credential.

# --- global read-only foundation switch (spec/009 REQ-906 / INV-09) ---
# There is no deploy-time actuation switch: the mode chokepoint (owner-set at runtime, audited) is the
# only authority for "may this actuate?" — the former `mutation.enabled` no-op value is removed (TG-112).

nameOverride: ""
fullnameOverride: ""

# --- credential sourcing (spec/009 REQ-904 / INV-13) ---
secrets:
  # reference = the operator supplies a Kubernetes Secret named `secrets.name` out-of-band.
  # external  = an ExternalSecret (External Secrets Operator) resolves the keys from an upstream store.
  mode: reference
  # name of the Kubernetes Secret that holds every credential key below (reference mode), or the
  # target Secret the ExternalSecret writes (external mode).
  name: grounder-secrets
  # external-mode only: the ClusterSecretStore/SecretStore that backs the ExternalSecret.
  externalSecretStore:
    kind: ClusterSecretStore
    name: ""
    refreshInterval: 1h
  # The credential KEYS expected inside the Secret. Values are supplied out-of-band, never here.
  keys:
    runtimeDSN: TG_RUNTIME_DSN         # DML-only tg_runtime role DSN (spec/009 REQ-905)
    migrationDSN: TG_MIGRATION_DSN     # DDL tg_migration role DSN, startup migration only
    litellmMasterKey: LITELLM_MASTER_KEY
    pgSuperuserPassword: PG_SUPERUSER_PASSWORD
    tgRuntimePassword: TG_RUNTIME_PASSWORD
    tgMigrationPassword: TG_MIGRATION_PASSWORD
    temporalPgPassword: TEMPORAL_PG_PASSWORD
    # model-provider keys consumed by the LiteLLM gateway
    zaiApiKey: ZAI_API_KEY
    deepseekApiKey: DEEPSEEK_API_KEY
    mistralApiKey: MISTRAL_API_KEY
    anthropicApiKey: ANTHROPIC_API_KEY
    openaiApiKey: OPENAI_API_KEY
    xaiApiKey: XAI_API_KEY

# --- the grounder control-plane (spec/009 REQ-903, REQ-909, REQ-910) ---
grounder:
  replicaCount: 1
  image:
    # The SAME distroless static binary that deploy/Dockerfile builds (spec/009 REQ-903).
    # Pin by immutable digest in real deploys; the placeholder tag below is overridden in CI/release.
    repository: registry.example.net/territory-grounder/grounder
    tag: "0.1.0"
    # digest wins over tag when set, e.g. sha256:....  (spec/009 REQ-903 — pin by digest)
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  # ports match deploy/docker-compose.yml
  publicPort: 8080     # authenticated public API
  adminPort: 8443      # elevated admin listener — CLUSTER-INTERNAL ONLY (spec/009 REQ-909)
  env:
    TG_LITELLM_URL: http://grounder-litellm:4000
    TG_LITELLM_KEY_REF: env:LITELLM_MASTER_KEY
    TG_PUBLIC_ADDR: ":8080"
    TG_ADMIN_ADDR: ":8443"
    # The grounder dials Temporal (as a client) to mint the ingest→triage session. The binary reads
    # TG_TEMPORAL_HOSTPORT (cmd/grounder/main.go); an unread TEMPORAL_ADDRESS silently degrades ingest to
    # validate-only despite the full Temporal stack being provisioned.
    TG_TEMPORAL_HOSTPORT: grounder-temporal:7233
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # non-root, read-only rootfs, no privilege escalation (spec/009 REQ-903 / INV-13)
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 15
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 5
    periodSeconds: 10
  service:
    type: ClusterIP
    port: 8080
  ingress:
    # public API only; admin/Temporal/Postgres are never placed here (spec/009 REQ-909)
    enabled: false
    className: ""
    annotations: {}
    host: grounder.example.org
    tls:
      enabled: false
      secretName: ""

# --- the Runner worker (spec/009 REQ-902 parity) ---
# The Temporal Runner poller/executor. WITHOUT this Deployment the grounder API enqueues triage workflows
# onto the tg.runner task queue that NOTHING consumes — the platform ingests alerts and reports healthy while
# triaging nothing (the load-bearing compose `worker` service, deploy/docker-compose.yml). Same image family
# as the grounder, built with BIN=worker (deploy/Dockerfile).
worker:
  replicaCount: 1
  image:
    repository: registry.example.net/territory-grounder/worker
    tag: "0.1.0"
    digest: ""
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  env:
    TG_LITELLM_URL: http://grounder-litellm:4000
    TG_LITELLM_KEY_REF: env:LITELLM_MASTER_KEY
    TG_TEMPORAL_HOSTPORT: grounder-temporal:7233
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault

# --- application Postgres + pgvector (spec/009 REQ-905) ---
postgres:
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  database: grounder
  superuser: postgres
  port: 5432
  storage:
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi
  # the two least-privilege roles are created by the init script (parity with compose postgres-init)
  init:
    createRoles: true

# --- LiteLLM model-gateway (spec/009 REQ-901, REQ-904) ---
litellm:
  image:
    repository: ghcr.io/berriai/litellm
    tag: main-stable
    pullPolicy: IfNotPresent
  port: 4000
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

# --- Temporal durable-orchestration substrate + its backing Postgres + UI (spec/009 REQ-901) ---
temporal:
  image:
    repository: temporalio/auto-setup
    tag: "1.25.2"
    pullPolicy: IfNotPresent
  frontendPort: 7233   # CLUSTER-INTERNAL ONLY (spec/009 REQ-909)
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  postgres:
    image:
      repository: postgres
      tag: "16"
      pullPolicy: IfNotPresent
    user: temporal
    database: temporal
    port: 5432
    # bounded like every other pod — the persistence tier of the durable orchestration substrate must not be
    # BestEffort (the first OOM-kill target under node pressure).
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    storage:
      size: 5Gi
      storageClassName: ""
  ui:
    enabled: true
    image:
      repository: temporalio/ui
      tag: "2.34.0"
      pullPolicy: IfNotPresent
    port: 8080   # CLUSTER-INTERNAL ONLY (spec/009 REQ-909)

# --- EGRESS ALLOWLIST (TG-160) ---
#
# Before this block the chart shipped NO NetworkPolicy at all: every pod in the release could reach
# anywhere the CNI would carry it, including Postgres and the Temporal UI, while docs/THREAT-MODEL.md
# advertised an egress step that did not exist anywhere in the tree. The compose stack got its network
# split in the same change (deploy/docker-compose.yml, three tiers); this is that posture for Kubernetes.
#
# DEFAULT OFF, deliberately. Enabling it makes egress DEFAULT-DENY for every pod in the release. With the
# allow lists below empty, pods keep cluster DNS and traffic to their own release and lose everything
# else — for the worker that means no estate, no trackers and no notifiers; for litellm, no model
# providers. That is what default-deny means and it is an outage if it arrives unannounced.
#
# THE SAFE ORDER (the ticket's "meter, then block"):
#   1. leave this off and run the in-process meter that ships with it (it is always on, observe-only);
#   2. read tg_egress_offallowlist_requests_total / _bytes_out_total and the "EGRESS OFF-ALLOWLIST"
#      log lines from the worker — they NAME each destination;
#   3. write those destinations into networkPolicy.egress.<component> below, as CIDRs and ports;
#   4. enable in staging, verify with a real connectivity test, then enable in production.
#
# ENFORCEMENT IS NOT GUARANTEED BY THIS CHART. Under a CNI that does not implement NetworkPolicy the
# objects apply cleanly and enforce NOTHING, silently. Verify by testing a connection, never by reading a
# successful `helm upgrade`.
networkPolicy:
  enabled: false
  # Cluster DNS, which a default-deny release needs before it can resolve even its own services.
  dns:
    namespace: kube-system
    podLabels:
      k8s-app: kube-dns
    port: 53
  # Off-cluster destinations, per workload. Keys are component names as used by grounder.selectorLabels
  # (grounder / worker / litellm / postgres / temporal / …). A component with no entry gets DNS and
  # intra-release traffic only.
  #
  # Every rule requires `cidrs`, `ports` and `why`. `why` is enforced by the template (helm `required`),
  # not by convention: an allowlist entry with no stated destination cannot be reviewed and cannot be
  # revoked later by anyone who was not in the room when it was added.
  #
  # Example — the shape a real deployment fills in:
  #   worker:
  #     - why: "OpenBao: the worker's AppRole and every SecretRef it resolves"
  #       cidrs: ["10.20.0.10/32"]
  #       ports: [{port: 8200, protocol: TCP}]
  #     - why: "LibreNMS + NetBox + PVE — the estate read lane"
  #       cidrs: ["10.20.30.0/24"]
  #       ports: [{port: 443, protocol: TCP}, {port: 8006, protocol: TCP}]
  egress:
    grounder: []
    worker: []
    litellm: []

commonLabels: {}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
