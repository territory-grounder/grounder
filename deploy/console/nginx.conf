# Serves the operator console SPA and proxies /api to the grounder control-plane over the compose network.
#
# HARDENED (unauthenticated leaks nothing): the static shell is NOT served to an unauthenticated request.
# `location /` gates on an auth subrequest to the grounder's mandatory-auth /v1/whoami (INV-01: 401 for an
# unauthenticated caller, 200 with a valid operator session cookie). An unauthenticated request is served
# ONLY login.html — no app bundle, no fixtures, no /v1/* endpoint names, no estate data. The /api proxy is
# intentionally NOT auth_request-gated here: the grounder authenticates every route itself (reject-before-
# parse), and POST /api/v1/session (login) MUST be reachable unauthenticated so an operator can sign in.
server {
  # 8080, not 80 (TG-289): the container runs as uid 101 with cap_drop [ALL], and binding a port below
  # 1024 would require handing CAP_NET_BIND_SERVICE back. The host still publishes 8080, so no operator
  # URL changes; see deploy/console/Dockerfile for the measured failure this avoids.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8; # the console is a UTF-8 single-file app; without this browsers fall back to windows-1252 (mojibake)

  # Security headers on EVERY response — the login page and the app alike. They live at server scope (not in
  # a location) on purpose: nginx `add_header` in a location DROPS every inherited header, so a per-location
  # add_header here would silently strip the security set from that location. server_tokens off removes the
  # nginx version banner. The CSP permits exactly what the single self-contained bundle needs — inline
  # script/style and data: fonts/images — plus same-origin XHR/SSE, and blocks framing, external origins,
  # <base> hijack and plugins. Cache-Control no-cache lives here too so the always-changing bundle revalidates.
  server_tokens off;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header Cache-Control "no-cache" always;

  # The auth subrequest. 2xx from the grounder = a valid operator session; 401/403 = not signed in. Body
  # stripped (this is a GET check), the operator's session cookie forwarded so the grounder judges it.
  location = /_authcheck {
    internal;
    proxy_pass http://grounder:8080/v1/whoami;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
  }

  # The app shell — GATED. Authenticated → the bundle (SPA fallback for client-side routes); unauthenticated
  # → login.html and nothing else. try_files runs only AFTER auth_request admits the request.
  location / {
    auth_request /_authcheck;
    # Fail-closed to the login page on EVERY non-2xx auth outcome, not just 401/403: auth_request turns a
    # 502/504/malformed /v1/whoami (grounder restarting, OOM, mid-deploy) into an internal error that would
    # otherwise reach the operator as a bare nginx 500 — locking out even a validly-signed-in operator during
    # a control-plane blip. @login is a static, pre-auth, no-data page, so this stays fail-closed (it can never
    # serve the bundle or /v1 data) while staying usable. Trade-off: if /v1/whoami is PERSISTENTLY broken (not
    # down, but always-erroring), a valid login round-trips back to the login page rather than naming the
    # auth-check fault — a diagnosability regression, not a security one, and an ops-log matter.
    error_page 401 403 500 502 503 504 = @login;
    try_files $uri $uri/ /index.html;
  }

  # The minimal login page — the ONE app-origin resource served without auth (no auth_request here). It is
  # self-contained: no app code, no fixtures, no estate data. Served from its OWN root (NOT the SPA document
  # root): it is a pre-auth page, not an asset the gated bundle references, so it lives OUTSIDE
  # /usr/share/nginx/html — where served_console_test's dead-weight reachability guard scopes its check —
  # rather than weakening that guard. Reached directly and via the @login fallback.
  location = /login.html { root /usr/share/nginx/login; }
  location @login { root /usr/share/nginx/login; try_files /login.html =401; }

  # API proxy → the grounder container (internal compose DNS name). Deliberately NOT auth_request-gated:
  # the grounder authenticates every route (INV-01, reject-before-parse), and the login POST must reach it.
  location /api/ {
    proxy_pass http://grounder:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
  }

  # Health of the console container itself — unauthenticated by design (a liveness probe that reveals nothing).
  # default_type (NOT add_header) sets the content type WITHOUT dropping the inherited server-level security
  # headers — an add_header here would strip CSP/XFO/nosniff from this one response (nginx inheritance rule).
  location = /console-healthz { default_type text/plain; return 200 'ok'; }
}
