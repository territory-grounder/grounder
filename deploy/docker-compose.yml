      # (blank ⇒ OFF, opt-in) drains it to CORPUS_FILE (mount it writable) via eval.IngestCaptured. The decay cron
      # (DECAY_INTERVAL, blank ⇒ OFF, opt-in) ages the three learned stores: learn half-life (LEARN_HALFLIFE,
      # in-code 30d) + estate decay-on-disproof (ESTATE_DECAY_FACTOR, in-code 0.5). Competence-plane, mutation OFF. ---
      TG_DISCOVERY_CORPUS_CAP: ${TG_DISCOVERY_CORPUS_CAP:-}
      TG_DISCOVERY_CORPUS_FILE: ${TG_DISCOVERY_CORPUS_FILE:-eval/discovery-corpus.json}
      TG_DISCOVERY_FLUSH_INTERVAL: ${TG_DISCOVERY_FLUSH_INTERVAL:-}
