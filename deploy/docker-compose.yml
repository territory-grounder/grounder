      # ENFORCE, matching what production has been running since 2026-08-04. The committed default was
      # `meter` while the box ran `enforce` from its own .env, so a clean redeploy would have silently
      # dropped the control back to counting (TG-324). Safe as a default because cmd/worker refuses to
