      # loaded on boot so the self-learning tier survives a restart instead of re-learning from zero (measured
      # 1,524 learned edges -> 0 on a redeploy). Ships ARMED at 15m — persistence that shipped inert would not
      # fix the wipe; competence-plane, a save/load failure is non-fatal. 0 disables (in-memory-only lifetime).
      TG_LEARN_PERSIST_INTERVAL: ${TG_LEARN_PERSIST_INTERVAL:-15m}
      # axis A2 (blast-radius precision): drop predicted/control blast-radius impacts below this path-product
      # confidence (0/unset = behavior-preserving; tune toward ~0.70 to cut low-confidence false positives).
      TG_PREDICT_MIN_CONFIDENCE: ${TG_PREDICT_MIN_CONFIDENCE:-}
      # --- Confidence calibrator (spec/020 T-020-15, REQ-2021). Read-only: periodically joins persisted agent
      # confidence (session_triage.confidence) to the LLM-free verified falsify outcome (infragraph_prediction,
      # by external_ref) and logs the reliability curve (Brier/ECE/MCE). OBSERVE-ONLY — adjudicates/gates nothing;
      # the policy min_confidence clamp stays OFF until an operator judges the reliability trustworthy. INTERVAL
      # in-code default 15m; BINS/SAMPLE_LIMIT fall back to 10/5000 when blank. Armed only with a DSN. ---
      TG_CALIBRATION_INTERVAL: ${TG_CALIBRATION_INTERVAL:-15m}
      # THE LEDGER-HEAD ANCHOR (TG-80 P1#1): how often the append-only governance_ledger HEAD is witnessed into
      # the append-only ledger_anchor store — external tamper-evidence for the audit spine (a truncated tail or
      # re-linked history that VerifyChain cannot see becomes a HEAD that regressed below a recorded witness).
      # OBSERVE-ONLY — it records a HEAD digest and never actuates. INTERVAL in-code default 1h; WINDOW = the
      # trailing rows folded into each digest (default 64). Armed only with a DSN. ---
      TG_LEDGER_ANCHOR_INTERVAL: ${TG_LEDGER_ANCHOR_INTERVAL:-1h}
      TG_LEDGER_ANCHOR_WINDOW: ${TG_LEDGER_ANCHOR_WINDOW:-64}
      # TG-509: the CONSUMING half — periodically CHECK the live ledger against its recorded witnesses
      # (VerifyAgainstAnchors) and surface a tamper. Coarse cadence (full-chain verify is O(chain×anchors)).
      TG_LEDGER_VERIFY_INTERVAL: ${TG_LEDGER_VERIFY_INTERVAL:-24h}
      # TG-510 Slice A: tamper-EVIDENCE for the maintained knowledge corpus (TG_KNOWLEDGE_FILE), reusing the
      # same append-only ledger_anchor witness under the 'knowledge-corpus' domain. OFF by default; blank/unset
      # ⇒ byte-identical to before (no chain, no witness, no verify). When ON (and a DSN is set), every corpus
      # write records a HEAD witness and a periodic pass WARNS if the on-disk corpus no longer reproduces the
      # latest witness — a raw edit outside the write path. EVIDENCE-ONLY: it never blocks retrieval. WINDOW =
      # trailing rows folded into each digest (default 64); VERIFY_INTERVAL is coarse (a full re-derive/pass).
      TG_CORPUS_APPEND_ONLY: ${TG_CORPUS_APPEND_ONLY:-}
      TG_CORPUS_ANCHOR_WINDOW: ${TG_CORPUS_ANCHOR_WINDOW:-64}
      TG_CORPUS_VERIFY_INTERVAL: ${TG_CORPUS_VERIFY_INTERVAL:-24h}
      # TG-519 Slice C: tamper-ENFORCEMENT — the owner-armed ESCALATION of TG-510 evidence. OFF by default;
      # blank/unset ⇒ byte-identical to TG-510 (evidence-only warn, the maintained corpus always composes). When
      # ON, every corpus load VERIFIES the maintained corpus against its latest witness and DROPS it from trusted
      # retrieval — composing from the SEED corpus alone — on tamper OR any unverifiable state (no witness store,
      # unreadable witnesses, no witness yet, an unparseable file). Fail-CLOSED, the deliberate INVERSE of TG-510
      # (evidence fails safe-WARN; enforcement fails safe-DROP: a false verify degrades retrieval to the seed —
      # safe — while a missed tamper reaching the agent is the real danger). Verifies against the witness TG-510
      # records, so arm it TOGETHER with TG_CORPUS_APPEND_ONLY (+ a DSN) or the corpus is dropped after the first
      # unwitnessed write.
      TG_CORPUS_ENFORCE: ${TG_CORPUS_ENFORCE:-}
