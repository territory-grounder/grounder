      TG_TRACKER_CREATE_PROJECT: ${TG_TRACKER_CREATE_PROJECT:-}
      # Jira
      TG_JIRA_URL: ${TG_JIRA_URL:-}
      TG_JIRA_EMAIL: ${TG_JIRA_EMAIL:-}
      TG_JIRA_TOKEN_REF: ${TG_JIRA_TOKEN_REF:-${JIRA_TOKEN:+env:JIRA_TOKEN}}
      JIRA_TOKEN: ${JIRA_TOKEN:-}
      TG_JIRA_TRANSITION_INPROGRESS: ${TG_JIRA_TRANSITION_INPROGRESS:-}
      TG_JIRA_TRANSITION_RESOLVED: ${TG_JIRA_TRANSITION_RESOLVED:-}
      TG_JIRA_TRANSITION_OPEN: ${TG_JIRA_TRANSITION_OPEN:-}
      # GitHub
      TG_GITHUB_URL: ${TG_GITHUB_URL:-}
      TG_GITHUB_OWNER: ${TG_GITHUB_OWNER:-}
      TG_GITHUB_REPO: ${TG_GITHUB_REPO:-}
      TG_GITHUB_TOKEN_REF: ${TG_GITHUB_TOKEN_REF:-${GITHUB_TOKEN:+env:GITHUB_TOKEN}}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      # ServiceNow
      TG_SERVICENOW_URL: ${TG_SERVICENOW_URL:-}
      TG_SERVICENOW_USER: ${TG_SERVICENOW_USER:-}
      TG_SERVICENOW_TOKEN_REF: ${TG_SERVICENOW_TOKEN_REF:-${SERVICENOW_TOKEN:+env:SERVICENOW_TOKEN}}
      SERVICENOW_TOKEN: ${SERVICENOW_TOKEN:-}
      TG_SERVICENOW_STATE_INPROGRESS: ${TG_SERVICENOW_STATE_INPROGRESS:-}
      TG_SERVICENOW_STATE_RESOLVED: ${TG_SERVICENOW_STATE_RESOLVED:-}
      TG_SERVICENOW_STATE_OPEN: ${TG_SERVICENOW_STATE_OPEN:-}
      # Matrix
      TG_MATRIX_HOMESERVER: ${TG_MATRIX_HOMESERVER:-}
      TG_MATRIX_TOKEN_REF: ${TG_MATRIX_TOKEN_REF:-${MATRIX_TOKEN:+env:MATRIX_TOKEN}}
      MATRIX_TOKEN: ${MATRIX_TOKEN:-}
      TG_MATRIX_APPROVERS: ${TG_MATRIX_APPROVERS:-}
      TG_MATRIX_ROOMS: ${TG_MATRIX_ROOMS:-}
      # TG-463 (B26): presented chat identity -> canonical approve_by login; resolution only, never a wider set
      TG_VOTER_ALIASES: ${TG_VOTER_ALIASES:-}
      TG_MATRIX_DEFAULT_ROOM: ${TG_MATRIX_DEFAULT_ROOM:-}
      # How often the inbound vote reader polls Matrix /sync. It is what makes an approval poll posted to
      # chat actually answerable there; without it a click reaches nothing and every vote must go
      # through the console. 0 is not special — the reader is armed whenever matrix is configured.
      TG_MATRIX_VOTE_POLL_INTERVAL: ${TG_MATRIX_VOTE_POLL_INTERVAL:-15s}
      # TG-386: arm the proposal-less-handoff page. When a substantive investigation concludes "a human is
      # needed, no safe action exists" (a non-empty conclusion on a DEEP_INVESTIGATION or handoff-limit
      # escalation), route it to the notifier. INERT by default (unset/empty ⇒ the notice is scheduled for
      # observability but not delivered) — opening this new outward paging path is a deliberate operator opt-in.
      TG_HANDOFF_NOTIFY_ENABLED: ${TG_HANDOFF_NOTIFY_ENABLED:-}
      # How long a console-saved module setting may be cached before the worker sees it. Short enough that
      # a Save lands in seconds; long enough that the config store is not on the hot path of the
      # notification lane — the lane whose whole job is to work during an incident.
      TG_MODULE_CONFIG_TTL: ${TG_MODULE_CONFIG_TTL:-10s}
      # Slack
      TG_SLACK_URL: ${TG_SLACK_URL:-}
      TG_SLACK_TOKEN_REF: ${TG_SLACK_TOKEN_REF:-${SLACK_TOKEN:+env:SLACK_TOKEN}}
      SLACK_TOKEN: ${SLACK_TOKEN:-}
      TG_SLACK_APPROVERS: ${TG_SLACK_APPROVERS:-}
      TG_SLACK_CHANNELS: ${TG_SLACK_CHANNELS:-}
      TG_SLACK_DEFAULT_CHANNEL: ${TG_SLACK_DEFAULT_CHANNEL:-}
      # Microsoft Teams
      TG_TEAMS_URL: ${TG_TEAMS_URL:-}
      TG_TEAMS_CONVERSATION: ${TG_TEAMS_CONVERSATION:-}
      TG_TEAMS_TOKEN_REF: ${TG_TEAMS_TOKEN_REF:-${TEAMS_TOKEN:+env:TEAMS_TOKEN}}
      TEAMS_TOKEN: ${TEAMS_TOKEN:-}
      TG_TEAMS_APPROVERS: ${TG_TEAMS_APPROVERS:-}
      # Email (SMTP)
      TG_EMAIL_SMTP: ${TG_EMAIL_SMTP:-}
      TG_EMAIL_FROM: ${TG_EMAIL_FROM:-}
      TG_EMAIL_TO: ${TG_EMAIL_TO:-}
      TG_EMAIL_APPROVERS: ${TG_EMAIL_APPROVERS:-}
      TG_EMAIL_SMTP_USER: ${TG_EMAIL_SMTP_USER:-}
      TG_EMAIL_SMTP_TOKEN_REF: ${TG_EMAIL_SMTP_TOKEN_REF:-${EMAIL_SMTP_PASSWORD:+env:EMAIL_SMTP_PASSWORD}}
      EMAIL_SMTP_PASSWORD: ${EMAIL_SMTP_PASSWORD:-}
      # Twilio (SMS / voice)
      TG_TWILIO_URL: ${TG_TWILIO_URL:-}
      TG_TWILIO_SID: ${TG_TWILIO_SID:-}
      TG_TWILIO_FROM: ${TG_TWILIO_FROM:-}
      TG_TWILIO_TO: ${TG_TWILIO_TO:-}
      TG_TWILIO_TOKEN_REF: ${TG_TWILIO_TOKEN_REF:-${TWILIO_TOKEN:+env:TWILIO_TOKEN}}
      TWILIO_TOKEN: ${TWILIO_TOKEN:-}
      # Mattermost
      TG_MATTERMOST_URL: ${TG_MATTERMOST_URL:-}
      TG_MATTERMOST_TOKEN_REF: ${TG_MATTERMOST_TOKEN_REF:-${MATTERMOST_TOKEN:+env:MATTERMOST_TOKEN}}
      MATTERMOST_TOKEN: ${MATTERMOST_TOKEN:-}
      TG_MATTERMOST_APPROVERS: ${TG_MATTERMOST_APPROVERS:-}
      TG_MATTERMOST_CHANNELS: ${TG_MATTERMOST_CHANNELS:-}
      # --- Actuation Regime Engine (spec/017, TG-110) — WIRED but INERT (mutation stays OFF). ---
      # Config-not-code regime rules over the SHARED estate object-model, JSON:
      # [{"id":"awx-edge","selector":"group:awx-managed","regime":"awx-job"}]. Absent ⇒ every target takes
      # the default lane. Selecting/launching through a lane happens only post-flip (mode stays Shadow).
      TG_REGIME_RULES: ${TG_REGIME_RULES:-}
      # The default lane for an UNMATCHED target: native-ssh (the existing SSH effect leaf) or none (refuse).
      TG_REGIME_DEFAULT_LANE: ${TG_REGIME_DEFAULT_LANE:-native-ssh}
      # AWX-job lane (the first non-SSH mutating channel). ABSENT base URL / launch token ⇒ the lane keeps its
      # FAIL-CLOSED pendingActuator (it can only refuse). The launch token is DISTINCT from the sensor token.
      TG_AWXJOB_BASE_URL: ${TG_AWXJOB_BASE_URL:-}
      TG_AWXJOB_LAUNCH_TOKEN_REF: ${TG_AWXJOB_LAUNCH_TOKEN_REF:-}
      TG_AWXJOB_CA: ${TG_AWXJOB_CA:-}
      # Operator template allowlist + op-class bindings + typed extra_vars schema, JSON:
      # [{"template_id":42,"op_class":"restart-service","extra_vars":{"target_host":"string"}}]. Empty ⇒ the
      # actuator is read-only (it can only refuse); a template not on the allowlist is never launchable.
      TG_AWXJOB_ALLOWLIST: ${TG_AWXJOB_ALLOWLIST:-}
      # Proxmox VE hypervisor guest-lifecycle lane (start-guest). The proxmox effect leaf is wired ONLY with a
      # PVE API base URL (https://{host}:8006/api2/json/) AND a PVEAPIToken secret ref; ABSENT ⇒ the lane is
      # fail-closed pendingActuator (refuse only). Guests are allowlisted (comma/space-separated names);
      # empty ⇒ default-deny (no guest actuatable). _INSECURE opt-in disables TLS verify for the internal
      # self-signed :8006 cert. Lifecycle floor (reboot/shutdown/reset/destroy) is non-configurable in-code.
      TG_PROXMOX_BASE_URL: ${TG_PROXMOX_BASE_URL:-}
      TG_PROXMOX_TOKEN_REF: ${TG_PROXMOX_TOKEN_REF:-}
      TG_PROXMOX_ALLOWED_GUESTS: ${TG_PROXMOX_ALLOWED_GUESTS:-}
      TG_PROXMOX_INSECURE: ${TG_PROXMOX_INSECURE:-}
      # TG-native guest-liveness detector (A1 detection latency): opt-in poll interval (e.g. 45s) that mints a
      # triage on an observed running→stopped transition of a watched guest, beating LibreNMS's ~6–11min
      # device-down push. Unset ⇒ OFF. SITE = estate label.
      #
      # It reads with the ESTATE READ pair (TG_PVE_URL + TG_PVE_TOKEN_REF, above), NOT the actuation lane's
      # write token — TG-350. It used to read TG_PROXMOX_BASE_URL/TOKEN_REF/ALLOWED_GUESTS, which the
      # credential plane split withholds from this triage worker, so on 2026-07-31 the detector silently lost
      # its credential and delivered nothing for six days. The TG_PROXMOX_* pair is still the fallback for a
      # `both`-plane worker, which is why those keys stay forwarded here.
      #
      # GUESTS is a fail-safe, not a filter: empty watches NOTHING, so a guest going down for maintenance
      # never mints a triage. Watching is not healing — what TG may START is the actuation worker's own
      # TG_ACTUATE_PROXMOX_ALLOWED_GUESTS, and the two lists are deliberately separate now.
      TG_PVE_LIVENESS_POLL_INTERVAL: ${TG_PVE_LIVENESS_POLL_INTERVAL:-}
      # TG-315 authlog collector — DARK BY DEFAULT. Empty means the loop does not run. Arming it opens an
      # SSH session per host per tick against the syslog-ng trees, which is an operator's posture decision.
      # TG_AUTHLOG_HOSTS is deliberately explicit: probed 2026-08-06 across all 126 monitored dc1 hosts,
      # exactly 15 ship logs, and enumerating the tree instead would read every directory syslog-ng ever
      # created — including the malformed hostnames it mints — and triage on them.
      TG_AUTHLOG_POLL_INTERVAL: ${TG_AUTHLOG_POLL_INTERVAL:-}
      TG_AUTHLOG_HOSTS: ${TG_AUTHLOG_HOSTS:-}
      TG_PVE_LIVENESS_SITE: ${TG_PVE_LIVENESS_SITE:-}
      TG_PVE_LIVENESS_GUESTS: ${TG_PVE_LIVENESS_GUESTS:-}
      # GLOBAL deferred-verify poll cron (armed only WITH an AWX launch client): poll interval + the bound
      # within which a launched job must reach a terminal or be recorded unverified. Inert at Shadow (empty queue).
      TG_REGIME_VERIFY_INTERVAL: ${TG_REGIME_VERIFY_INTERVAL:-1m}
      TG_REGIME_VERIFY_BOUND: ${TG_REGIME_VERIFY_BOUND:-30m}
      # --- gitops-mr SENSOR (TG-122 slice 2). The allowlist is a JSON array of per-repo policies
      # ({repo_id,base_url,project_path,target_branch,branch_prefix,token_ref,op_class}) — it CARRIES
      # api-scoped GitLab PAT refs, so it is plane-scoped like every actuation credential. Empty = no
      # poller: a reserved gitops-mr launch resolves `unverified` at its bound (fail-safe). The poller
      # never emits `successful` — merge is not convergence (see modules/actuation/gitopsmr/poller.go);
      # the per-lane bound reflects a human review cycle, not awx-job minutes. ---
      TG_GITOPSMR_ALLOWLIST: ${TG_GITOPSMR_ALLOWLIST:-}
      TG_GITOPSMR_VERIFY_BOUND: ${TG_GITOPSMR_VERIFY_BOUND:-72h}
      # Read-only playbooks-as-knowledge lane (T-017-5): pulls AWX runbooks READ-ONLY into the corpus. The
      # sensor token is READ-ONLY + DISTINCT from the launch token. Disabled unless all four are set.
      TG_AWXPLAYBOOKS_BASE_URL: ${TG_AWXPLAYBOOKS_BASE_URL:-}
      TG_AWXPLAYBOOKS_SENSOR_TOKEN_REF: ${TG_AWXPLAYBOOKS_SENSOR_TOKEN_REF:-}
      TG_AWXPLAYBOOKS_CA: ${TG_AWXPLAYBOOKS_CA:-}
      TG_AWXPLAYBOOKS_CORPUS: ${TG_AWXPLAYBOOKS_CORPUS:-}
      TG_AWXPLAYBOOKS_INTERVAL: ${TG_AWXPLAYBOOKS_INTERVAL:-}
    # Read-only secret material for the syslog-ng SSH reads: deploy/secrets/ on the box (gitignored —
    # only its .gitignore is committed) mounts at /secrets read-only; .env references file:/secrets/….
    # The knowledge mount is READ-WRITE here: the worker MAINTAINS the corpus (lessons merge + refresh);
    # the grounder mounts the same dir read-only to serve it as the wiki.
    volumes:
      - ./secrets:/secrets:ro
      - ./knowledge:/knowledge
    depends_on:
      postgres:
        condition: service_healthy
      litellm:
        condition: service_started
      temporal:
        condition: service_started
      secrets-perms:
        condition: service_completed_successfully
    # TG-160 EGRESS: this is the service the ticket's enumeration is about. It legitimately reaches OpenBao,
    # the estate (LibreNMS, NetBox, PVE, AWX/Semaphore, SSH hosts, journald hosts), the trackers (YouTrack,
    # Jira, GitHub, ServiceNow), the notifiers (Matrix, Slack, Teams, Mattermost, Twilio, e-mail), the
    # observability exporters (Langfuse, OpenObserve, healthchecks.io) and LDAPS — every one of them
    # declared as an endpoint env above. It publishes NO port (prometheus scrapes worker:8444 over the
    # backplane), so it gets no frontdoor.
    #
    # It is also the process that runs the LLM agent over UNTRUSTED alert/syslog/host content, so it is the
    # one container where "it can reach the internet" is the actual threat rather than a convenience. The
    # network tier cannot narrow that further without breaking triage; what narrows it is the per-destination
    # meter this same change installs in-process (core/egress, wired at cmd/worker/main.go), which names any
    # destination outside the declared set. Network tier = coarse and unbypassable; meter = precise and
    # bypassable. Both, deliberately.
    networks:
      tg-backplane: {}
      tg-egress:
        # Pinned (TG-381): the host-side TG-EGRESS-LAN chain exempts this container from the tier's
        # RFC1918 default-drop BY SOURCE — its estate reach is wildcard SSH, not enumerable destinations.
        ipv4_address: 172.23.0.10

  # ===================================================================================================
  # --- THE ACTUATION-PLANE WORKER (TG-153). OPT-IN. NOT STARTED BY DEFAULT. ---
  # ===================================================================================================
  #
  # WHY IT EXISTS. Until 2026-08-04 the single `worker` above did two things in one address space: it ran
  # the LLM triage agent over UNTRUSTED alert / syslog / host content, and it held the credential that
  # MUTATES the estate (TG_ACTUATION_SSH_KEY). A compromise of the first yields the second — the chain the
  # July-2026 HuggingFace intrusion walked. OpenBao already refuses each plane the other's credentials
  # (policies tg-triage-ro / tg-actuate-ro, AppRoles tg-triage / tg-actuate, verified live 2026-08-04);
  # this service is what gives that substrate split two processes to bind to.
  #
  # THE DEFAULT STACK IS UNCHANGED. This service sits behind the `split-planes` compose profile, so a plain
  # `docker compose up -d` does not start it and `worker` keeps running TG_CREDENTIAL_PLANE=both — the
  # pre-TG-153 posture, byte for byte. A profile rather than a commented-out block on purpose: commented
  # YAML is never parsed, never validated and rots silently, whereas this is checked by `docker compose
  # config` and by deploy/*_test.go on every CI run while still being inert until asked for.
  #
  # TO SPLIT (both steps, or you have not split anything):
  #   1. In .env set the TRIAGE worker's plane and REMOVE every actuation variable from it:
  #        TG_CREDENTIAL_PLANE=triage
  #        TG_OPENBAO_ROLE_ID_REF=file:/secrets/tg-triage-role-id
  #        TG_OPENBAO_SECRET_ID_REF=file:/secrets/tg-triage-secret-id
  #        TG_OPENBAO_AUTH_METHOD=approle
  #        # and unset: TG_ACTUATION_SSH_KEY, TG_ACTUATION_SSH_HOST, TG_ACTUATION_SSH_IDENTITY,
  #        #            TG_ACTUATION_SSH_KNOWN_HOSTS, TG_ACTUATION_ALLOWED_UNITS,
  #        #            TG_ACTUATION_ALLOWED_CONTAINERS, TG_ACTUATION_SSH_PER_TARGET,
  #        #            TG_PROXMOX_TOKEN_REF, TG_AWXJOB_LAUNCH_TOKEN_REF
  #      The triage worker REFUSES TO BOOT if any of those is still set — the split is asserted, not assumed.
  #   2. Set the actuation worker's own AppRole (the TG_ACTUATE_* variables below) and bring it up:
  #        docker compose --profile split-planes up -d worker-actuate
  #   3. SPLIT THE DATABASE TOO (TG-164), or step 1 has bounded what the triage worker can FETCH and
  #      nothing about what it can WRITE. Both workers connected as tg_runtime until this step, so a
  #      compromised triage worker could still forge action_verdict / action_execution /
  #      interceptor_gate_verdict / policy_decision — the record of the actuation it could not perform.
  #        TG_TRIAGE_PASSWORD / TG_ACTUATE_PASSWORD   (creates the roles at FIRST postgres init only;
  #                                                    on an existing DB see postgres-init/01-plane-roles.sh)
  #        TG_DB_DSN_TRIAGE  on `worker`
  #        TG_DB_DSN_ACTUATE on `worker-actuate`
  #      Each worker's boot log then names the role it authenticated as and whether that role can still
  #      write its off-plane tables — "LIVE EXPOSURE" until it cannot.
  #
  # WHAT EACH PLANE'S COMPROMISE THEN YIELDS is written down in docs/THREAT-MODEL.md §5 — read it before
  # relying on this, because the bound is real but it is not "nothing".
  worker-actuate:
    profiles: ["split-planes"] # inert unless `--profile split-planes` / COMPOSE_PROFILES names it
    image: ${TG_WORKER_IMAGE:-registry-github.com/territory-grounder/grounder/worker}:${TG_TAG:-latest}
    # TG-170: the ACTUATION plane gets the same bound as the triage plane. The ticket names worker,
    # grounder and litellm; worker-actuate is the same binary on the split-planes profile and was not
    # listed. Leaving it unbounded while bounding triage would repeat TG-330 exactly — the brake fitted to
    # the plane that cannot mutate the estate and missing from the one that can.
    #
    # Probe port is :8445, its own admin listener (TG_WORKER_ADMIN_ADDR), not the triage worker's :8444 —
    # the binary reads that variable itself, so the same -healthcheck entry point resolves the right one.
    deploy:
      resources:
        limits: {cpus: "1", memory: 512M}
        reservations: {cpus: "0.1", memory: 128M}
    healthcheck:
      test: ["CMD", "/app", "-healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # Identical hardening to `worker` (deploy/hardening_parity_test.go asserts both, and asserts that a new
    # service cannot arrive without declaring a posture).
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/tmp"]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        BIN: worker
    environment:
      # ★ THE ACTUATION PLANE READS TG_ACTUATE_*-PREFIXED VARIABLES (TG-153).
      #
      # Found by actually deploying the split on one host. Both worker services interpolate from the SAME
      # .env, so the runbook step "remove TG_ACTUATION_* from .env" (required, because the triage worker
      # REFUSES TO BOOT while an actuation ref is in its environment) also emptied them here — and the
      # actuation worker came up with no credentials at all. The split was undeployable on a single host,
      # which is the only shape most installations have.
      #
      # The prefix is the convention this block already used for TG_ACTUATE_OPENBAO_*: the two planes are
      # two identities and two configurations that happen to share a file, so they need distinct names. An
      # operator sets TG_ACTUATE_ACTUATION_SSH_KEY and deletes TG_ACTUATION_SSH_KEY; the triage worker then
      # cannot see a value that does not exist, which is a stronger guarantee than asking it not to look.
      # ★ THE PLANE. This process polls ONLY tg.actuate, registers ONLY the estate-mutating activity, and
      # constructs NO untrusted-content reader (no agent investigation tools, no alert ingest poller). It
      # REFUSES TO BOOT if it is handed a read-triage reference.
      TG_CREDENTIAL_PLANE: actuation
      TG_CONFIG_IGNORE_STORE: ${TG_CONFIG_IGNORE_STORE:-}
      # TG-506: the actuation plane runs the SAME AuditedEngine as the interceptor's policy decider, so it must
      # observe the same admin engine-toggle override (read from the shared durable policy_engine_toggle row).
      # Default dormant; the never-auto floor (INV-09) clamps regardless of the toggle.
      TG_POLICY_ENGINE_TOGGLE: ${TG_POLICY_ENGINE_TOGGLE:-}
      # ★ ITS OWN OpenBao IDENTITY — the whole point. `tg-actuate` is bound to policy tg-actuate-ro, which
      # can read ONLY tg/actuator and tg/proxmox and is DENIED everything the triage plane reads. Give this
      # service the tg-actuate AppRole and the triage worker the tg-triage AppRole; sharing one identity
      # between them re-creates the gap in the substrate while the processes look split.
      TG_OPENBAO_ADDR: ${TG_OPENBAO_ADDR:-}
      TG_OPENBAO_CA: ${TG_OPENBAO_CA:-}
      TG_OPENBAO_AUTH_METHOD: ${TG_ACTUATE_OPENBAO_AUTH_METHOD:-approle}
      TG_OPENBAO_ROLE_ID_REF: ${TG_ACTUATE_OPENBAO_ROLE_ID_REF:-}
      TG_OPENBAO_SECRET_ID_REF: ${TG_ACTUATE_OPENBAO_SECRET_ID_REF:-}
      TG_OPENBAO_KV_MOUNT: ${TG_OPENBAO_KV_MOUNT:-}
      TG_OPENBAO_KV_PREFIX: ${TG_OPENBAO_KV_PREFIX:-}
      # --- Blast-radius PREDICTION TUNING. Read from the SAME env keys the triage worker reads, because
      # both planes run the same binary and the same core/predict code — but until 2026-08-06 these were
      # declared on the `worker` block ONLY, so the two planes computed DIFFERENT blast radii for the same
      # incident. Measured live on that date:
      #
      #   worker          TG_PREDICT_MIN_CONFIDENCE=0.70   TG_BLAST_RADIUS_WIDE_THRESHOLD=8
      #   worker-actuate  (both absent -> code defaults 0 and 8)
      #
      # MinConfidence 0 keeps EVERY impact regardless of path-product confidence; 0.70 drops the
      # low-confidence far/learned edges. So the plane that gates a proposal and the plane that executes it
      # were reasoning over different widths. The direction happens to be conservative (the actuation plane
      # predicted MORE hosts, and for blast radius over-prediction is the cautious side) — but a safety
      # parameter that differs by plane BY ACCIDENT is not a posture, and nothing recorded an intent either
      # way. One operator setting now governs both, which is the convention every non-credential key here
      # already follows.
      TG_PREDICT_MIN_CONFIDENCE: ${TG_PREDICT_MIN_CONFIDENCE:-}
      TG_BLAST_RADIUS_WIDE_THRESHOLD: ${TG_BLAST_RADIUS_WIDE_THRESHOLD:-8}
      # ESTATE-SNAPSHOT RETENTION (TG-355) — the SAME keys the triage worker reads, because both planes run
      # the same binary and the same sweep. Forwarded here so one operator setting governs both: a key set on
      # one block only is how TG_PREDICT_MIN_CONFIDENCE ended up 0.70 on the gating plane and unset on the
      # executing one, which had the two computing different blast radii for the same incident.
      TG_ESTATE_SNAPSHOT_KEEP_PER_PLANE: ${TG_ESTATE_SNAPSHOT_KEEP_PER_PLANE:-}
      TG_ESTATE_SNAPSHOT_REAP_INTERVAL: ${TG_ESTATE_SNAPSHOT_REAP_INTERVAL:-}
      # ATTRIBUTION RULESET (TG-309). THIS is the plane that ACTS, and it had no attribution config at
      # all — measured live 2026-08-07 on the running actuation worker:
      #   attribution: TG_ATTRIBUTION_CONFIG unset — using the generic embedded default
      #   attribution: carve-out host coverage 0/20 — NOT covered: <every allowlisted guest>
      #     "A harness cycle on an uncovered guest resolves to an unadjudicated contradiction and
      #      escalates to a human"
      # while the TRIAGE worker — which performs no heals — held the operator ruleset and both carve-outs.
      # The config was on the plane that cannot act and absent from the plane that does.
      #
      # No new secret and no new mount: this block already mounts ./secrets:/secrets:ro, so the file the
      # triage worker reads is ALREADY present here and was simply never pointed at.
      TG_ATTRIBUTION_CONFIG: ${TG_ATTRIBUTION_CONFIG:-}
      # RELAY MAX AGE (TG-346): THIS is the plane that reads it — the snapshot relay is what lets this
      # plane's mutation gate refuse over the triage plane's whole persisted graph instead of the 17 edges
      # its own credentials can see, without ever holding a read-triage secret.
      TG_ESTATE_SNAPSHOT_RELAY_MAX_AGE: ${TG_ESTATE_SNAPSHOT_RELAY_MAX_AGE:-}
      # COST / SPEND GUARD (TG-48) — the SAME keys the triage worker reads. This plane forwarded NONE of
      # them, so it ran with the model gateway un-wrapped while triage metered: `tg_cost_metering` read 1
      # on worker and 0 on worker-actuate. The cost store is explicitly cross-process — the boot line says
      # "backed by the DURABLE cross-process store (cost_accrual + cost_breaker_state); a trip
      # force-Shadows every sibling worker" — so a plane that cannot see the config never accrues its
      # share, and TG_COST_PER_ACTUATION_USD is about ACTUATION cost on the plane that actuates.
      # Same defect as TG_PREDICT_MIN_CONFIDENCE being set on one block only (!1085).
      TG_COST_DAILY_BUDGET_USD: ${TG_COST_DAILY_BUDGET_USD:-0}
      TG_COST_SESSION_CEILING_USD: ${TG_COST_SESSION_CEILING_USD:-0}
      TG_COST_DEFAULT_RATE_PER_1K: ${TG_COST_DEFAULT_RATE_PER_1K:-0}
      TG_COST_PER_ACTUATION_USD: ${TG_COST_PER_ACTUATION_USD:-0}
      TG_COST_RATE_fast_PER_1K: ${TG_COST_RATE_fast_PER_1K:-0}
      TG_COST_RATE_primary_PER_1K: ${TG_COST_RATE_primary_PER_1K:-0}
      # --- Actuation credentials. THESE LIVE HERE AND NOWHERE ELSE once the split is on. ---
      TG_ACTUATION_SSH_HOST: ${TG_ACTUATE_ACTUATION_SSH_HOST:-}
      TG_ACTUATION_SSH_IDENTITY: ${TG_ACTUATE_ACTUATION_SSH_IDENTITY:-}
      TG_ACTUATION_SSH_KNOWN_HOSTS: ${TG_ACTUATE_ACTUATION_SSH_KNOWN_HOSTS:-}
      TG_ACTUATION_SSH_KEY: ${TG_ACTUATE_ACTUATION_SSH_KEY:-}
      # TG-423: ssh CA/signed-cert auth on the ACTUATION plane (these live here once the split is on). EMPTY =
      # OFF ⇒ the static key path, unchanged. See the worker service block for the full contract; arming still
      # needs the estate step (the CA into each target's TrustedUserCAKeys).
      TG_SSHCA_ADDR: ${TG_ACTUATE_SSHCA_ADDR:-}
      TG_SSHCA_MOUNT: ${TG_ACTUATE_SSHCA_MOUNT:-}
      TG_SSHCA_ROLE: ${TG_ACTUATE_SSHCA_ROLE:-}
      TG_SSHCA_TOKEN_REF: ${TG_ACTUATE_SSHCA_TOKEN_REF:-}
      TG_SSHCA_CA: ${TG_ACTUATE_SSHCA_CA:-}
      TG_ACTUATION_SSH_USER: ${TG_ACTUATE_ACTUATION_SSH_USER:-root}
      TG_ACTUATION_SSH_PER_TARGET: ${TG_ACTUATE_ACTUATION_SSH_PER_TARGET:-}
      TG_ACTUATION_ALLOWED_UNITS: ${TG_ACTUATE_ACTUATION_ALLOWED_UNITS:-}
      TG_ACTUATION_ALLOWED_CONTAINERS: ${TG_ACTUATE_ACTUATION_ALLOWED_CONTAINERS:-}
      TG_PROXMOX_BASE_URL: ${TG_ACTUATE_PROXMOX_BASE_URL:-}
      TG_PROXMOX_TOKEN_REF: ${TG_ACTUATE_PROXMOX_TOKEN_REF:-}
      TG_PROXMOX_ALLOWED_GUESTS: ${TG_ACTUATE_PROXMOX_ALLOWED_GUESTS:-}
      TG_PROXMOX_INSECURE: ${TG_ACTUATE_PROXMOX_INSECURE:-}
      TG_AWXJOB_BASE_URL: ${TG_ACTUATE_AWXJOB_BASE_URL:-}
      TG_AWXJOB_LAUNCH_TOKEN_REF: ${TG_ACTUATE_AWXJOB_LAUNCH_TOKEN_REF:-}
      TG_AWXJOB_CA: ${TG_ACTUATE_AWXJOB_CA:-}
      TG_AWXJOB_ALLOWLIST: ${TG_ACTUATE_AWXJOB_ALLOWLIST:-}
      # gitops-mr sensor on the ACTUATE plane (TG-122): same TG_ACTUATE_ host-env remap as awxjob above.
      TG_GITOPSMR_ALLOWLIST: ${TG_ACTUATE_GITOPSMR_ALLOWLIST:-}
      # TG-555: the gitops-mr reconcile-convergence reader (Argo CD Application status) — the ACTUATE plane
      # builds the poller, so its read-only k8s SA token/CA/API are remapped here from the TG_ACTUATE_ host env.
      TG_K8S_CONVERGENCE_API: ${TG_ACTUATE_K8S_CONVERGENCE_API:-}
      TG_K8S_CONVERGENCE_CA: ${TG_ACTUATE_K8S_CONVERGENCE_CA:-}
      TG_K8S_CONVERGENCE_NS: ${TG_ACTUATE_K8S_CONVERGENCE_NS:-argocd}
      TG_K8S_CONVERGENCE_TOKEN: ${TG_ACTUATE_K8S_CONVERGENCE_TOKEN:-}
      # TG-122: the arm flip and the op-class->propose map belong HERE, on the plane that builds the
      # actuator and runs the effect. They were forwarded only to `worker`, whose TRIAGE plane has the
      # allowlist WITHHELD (credential_plane.go actuationPlaneEnvKeys) — so the plane with the allowlist
      # had no arm flag and the plane with the arm flag had no allowlist, and the lane could not be armed
      # on a split deployment at all, in either process.
      TG_GITOPSMR_ARM: ${TG_GITOPSMR_ARM:-}
      TG_GITOPSMR_PROPOSE_MAP: ${TG_GITOPSMR_PROPOSE_MAP:-}
      TG_GITOPSMR_VERIFY_BOUND: ${TG_ACTUATE_GITOPSMR_VERIFY_BOUND:-72h}
      TG_REGIME_RULES: ${TG_REGIME_RULES:-}
      TG_REGIME_DEFAULT_LANE: ${TG_REGIME_DEFAULT_LANE:-}
      TG_REGIME_VERIFY_INTERVAL: ${TG_REGIME_VERIFY_INTERVAL:-1m}
      TG_REGIME_VERIFY_BOUND: ${TG_REGIME_VERIFY_BOUND:-30m}
      # --- Shared substrate. The mutation gate, the sealed store and the ledger are the SAME ones the
      # triage worker uses: the split bounds which credentials each process holds, it does NOT create a
      # second, weaker governance path. The mode chokepoint still fails closed to Shadow here. ---
      TG_RUNTIME_DSN: ${TG_RUNTIME_DSN:?set in .env}
      TG_DB_DSN: ${TG_DB_DSN:-${TG_RUNTIME_DSN}}
      # ★ THE PLANE-SCOPED DB IDENTITY (TG-164). Until this existed, "the SAME ledger and sealed store" above
      # also meant the same DATABASE ROLE — so the triage worker, which reads untrusted content, could write
      # action_verdict / action_execution / interceptor_gate_verdict / policy_decision: it could forge the
      # record of the actuation only THIS process can perform. Set TG_DB_DSN_ACTUATE (and TG_DB_DSN_TRIAGE on
      # `worker`) to give each plane its own role; unset, both fall back to TG_DB_DSN and the boot log says
      # the database half is not in force.
      TG_DB_DSN_ACTUATE: ${TG_DB_DSN_ACTUATE:-}
      TG_TEMPORAL_HOSTPORT: temporal:7233
      TG_SEAL_KEY: ${TG_SEAL_KEY:-}
      TG_SEAL_KEY_REF: ${TG_SEAL_KEY_REF:-env:TG_SEAL_KEY}
      TG_SEAL_TRANSIT_KEY: ${TG_SEAL_TRANSIT_KEY:-}
      TG_SEAL_TRANSIT_ADDR: ${TG_SEAL_TRANSIT_ADDR:-}
      TG_SEAL_TRANSIT_TOKEN_REF: ${TG_SEAL_TRANSIT_TOKEN_REF:-}
      TG_SEAL_TRANSIT_MOUNT: ${TG_SEAL_TRANSIT_MOUNT:-}
      TG_SECRET_POLICY: ${TG_SECRET_POLICY:-off}
      TG_MUTATION_BREAKER_THRESHOLD: ${TG_MUTATION_BREAKER_THRESHOLD:-1}
      TG_MODE_TRANSITION_OPERATORS: ${TG_MODE_TRANSITION_OPERATORS:-}
      # The model gateway: still needed (the post-execution verifier and the ledger writer share the worker
      # binary), but this process registers no agent toolset, so no untrusted content reaches a prompt here.
      TG_LITELLM_URL: http://litellm:4000
      TG_LITELLM_KEY_REF: ${TG_LITELLM_KEY_REF:-env:LITELLM_MASTER_KEY}
      # TG-81 b3: verdict-ledger Ed25519 provenance (both dormant when blank; verdictsig_wire.go)
      TG_VERDICT_SIGNING_SEED_REF: ${TG_VERDICT_SIGNING_SEED_REF:-}
      TG_VERDICT_PUBLIC_KEY: ${TG_VERDICT_PUBLIC_KEY:-}
      # TG-80 P2-6: the KILLED terminal flip (blank = OFF, jailbreak hits keep polling; arming is eval-gated)
      TG_SCREEN_KILL_TERMINAL: ${TG_SCREEN_KILL_TERMINAL:-}
      # spec/016 REQ-1604 T-016-5: gate 4d2 authn-compose (blank = DARK, the gate row says so; 1/true =
      # every policy-authorized target's identity must resolve via the audited resolver before execute)
      TG_AUTHN_COMPOSE: ${TG_AUTHN_COMPOSE:-}
      # spec/024 T-024-6: the HOMELAB-tier vw: scheme (Vaultwarden). Blank addr = substrate OFF and every
      # vw: reference fails closed; the two refs are REFERENCES to the vault account's own credentials.
      TG_VAULTWARDEN_ADDR: ${TG_VAULTWARDEN_ADDR:-}
      TG_VAULTWARDEN_EMAIL_REF: ${TG_VAULTWARDEN_EMAIL_REF:-}
      TG_VAULTWARDEN_PASSWORD_REF: ${TG_VAULTWARDEN_PASSWORD_REF:-}
      # TG-85 write slice 4: the Cisco WRITE lane. Blank devices = unconfigured (nothing constructed);
      # _ARM is the separate owner arming flip. Both are read in worker_actuation_wire.go.
      TG_CISCO_WRITE_DEVICES: ${TG_CISCO_WRITE_DEVICES:-}
      TG_CISCO_READ_DEVICES: ${TG_CISCO_READ_DEVICES:-}
      TG_CISCO_WRITE_ARM: ${TG_CISCO_WRITE_ARM:-}
      # TG-180: the observability fault-injection PROBE harness. Every key blank = the loop never starts
      # (the boot line says "not configured"); ENABLED is a separate arm on top of a configured pool.
      TG_OBSERVE_PROBE_ENABLED: ${TG_OBSERVE_PROBE_ENABLED:-}
      TG_OBSERVE_PROBE_POOL_FILE: ${TG_OBSERVE_PROBE_POOL_FILE:-}
      TG_OBSERVE_PROBE_SNAP_NODE: ${TG_OBSERVE_PROBE_SNAP_NODE:-}
      TG_OBSERVE_PROBE_CLASSES: ${TG_OBSERVE_PROBE_CLASSES:-}
      TG_OBSERVE_PROBE_CADENCE: ${TG_OBSERVE_PROBE_CADENCE:-}
      TG_OBSERVE_PROBE_RESTORE_AFTER: ${TG_OBSERVE_PROBE_RESTORE_AFTER:-}
      TG_OBSERVE_PROBE_SSH_KEY: ${TG_OBSERVE_PROBE_SSH_KEY:-}
      TG_OBSERVE_PROBE_SSH_TIMEOUT: ${TG_OBSERVE_PROBE_SSH_TIMEOUT:-}
      TG_OBSERVE_PROBE_WINDOW: ${TG_OBSERVE_PROBE_WINDOW:-}
      # spec/024 T-024-5: the HOMELAB-tier passbolt: scheme. Blank addr = substrate OFF; the key ref
      # points at the robot's ASCII-armored OpenPGP PRIVATE key, which is this tier's secret-zero.
      TG_PASSBOLT_ADDR: ${TG_PASSBOLT_ADDR:-}
      TG_PASSBOLT_KEY_REF: ${TG_PASSBOLT_KEY_REF:-}
      TG_PASSBOLT_PASSPHRASE_REF: ${TG_PASSBOLT_PASSPHRASE_REF:-}
      # vSphere estate source (TG-91): DARK unless TG_VSPHERE_URL is set. The password is the only sealed
      # value (TG_VSPHERE_TOKEN_REF); _INSECURE opts INTO skipping TLS verification and defaults off.
      TG_VSPHERE_URL: ${TG_VSPHERE_URL:-}
      TG_VSPHERE_USER: ${TG_VSPHERE_USER:-}
      TG_VSPHERE_TOKEN_REF: ${TG_VSPHERE_TOKEN_REF:-}
      TG_VSPHERE_INSECURE: ${TG_VSPHERE_INSECURE:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      # A DISTINCT admin port: two workers on one host cannot both own :8444, and /halt must stay reachable
      # for THIS process — it is the one that can actuate, so it is the one whose kill-switch matters most.
      TG_WORKER_ADMIN_ADDR: ":8445"
      TG_ADMIN_TOKEN_REF: ${TG_ADMIN_TOKEN_REF:-env:TG_ADMIN_TOKEN}
      TG_ADMIN_TOKEN: ${TG_ADMIN_TOKEN:-}
      # The outbound meter (TG-160), same binary and same knobs as the triage worker above. Present here
      # for parity, deliberately: a deployment that meters one plane and not the other ends up with two
      # different outbound postures for reasons nobody intended — and THIS is the plane holding the
      # estate-mutating credential, so it is the one whose destinations matter most.
      # TG-336: the dead-man on TG's own input. INTERVAL is how often the intake liveness is re-read;
      # WINDOW is the baseline a source's silence is judged against — a source that alerts weekly is not
      # broken, one that delivered 500 alerts this week and nothing today is the estate going deaf.
      TG_INGEST_FRESHNESS_INTERVAL: ${TG_INGEST_FRESHNESS_INTERVAL:-2m}
      # How often TG-302's premise is re-measured: the count of credential-shaped rows in
      # agent_step_evidence, which that decision assumed to be zero (TG-345). Counts only — never a
      # payload — so the watcher cannot itself become a way to read one.
      TG_EVIDENCE_SHAPE_INTERVAL: ${TG_EVIDENCE_SHAPE_INTERVAL:-15m}
      TG_LEDGER_SHAPE_INTERVAL: ${TG_LEDGER_SHAPE_INTERVAL:-}
      TG_LOOP_CLOSURE_INTERVAL: ${TG_LOOP_CLOSURE_INTERVAL:-}
      TG_CATEGORY_COVERAGE_INTERVAL: ${TG_CATEGORY_COVERAGE_INTERVAL:-}
      TG_PREDICTION_WIDTH_INTERVAL: ${TG_PREDICTION_WIDTH_INTERVAL:-}
      TG_INGEST_FRESHNESS_WINDOW: ${TG_INGEST_FRESHNESS_WINDOW:-168h}
      # TG-173: how often the HUMAN APPROVAL QUEUE's depth is re-read. Faster than the intake
      # dead-man because a flood of the operator builds in minutes, not hours.
      TG_POLL_QUEUE_INTERVAL: ${TG_POLL_QUEUE_INTERVAL:-30s}
      # TG-344: how often TG asks each source what it currently HAS, so the arrived-count has a
      # denominator. A quiet estate and a broken connector published identically without it.
      TG_UPSTREAM_PROBE_INTERVAL: ${TG_UPSTREAM_PROBE_INTERVAL:-2m}
      TG_EGRESS_ALLOW: ${TG_EGRESS_ALLOW:-}
      # ENFORCE, matching what production has been running since 2026-08-04. The committed default was
      # `meter` while the box ran `enforce` from its own .env, so a clean redeploy would have silently
      # dropped the control back to counting (TG-324). Safe as a default because cmd/worker refuses to
      # enforce against an EMPTY allowlist and falls back to meter with a loud log — a deployment that
      # declares no destinations degrades to counting rather than losing the network.
      TG_EGRESS_MODE: ${TG_EGRESS_MODE:-enforce}
      # The estate TOPOLOGY the mutation gate reasons over (host-match, blast radius). Inventory, not alert
      # prose — see docs/THREAT-MODEL.md §5 for why this is read here and what it costs.
      #
      # A SEPARATE VALUE FROM THE TRIAGE PLANE'S, pointing at TOPOLOGY-SCOPED credentials (TG-337). The
      # triage plane's tokens can read alert bodies and the event log, because triage legitimately does.
      # This plane must not: it holds the estate's mutation keys, and withholding untrusted content from it
      # is what stops IT from becoming the thing that gets popped. The scoped LibreNMS accounts hold
      # device.view/viewAny/viewAll and nothing else — verified 2026-08-06 by the only check that means
      # anything here, which is that the token is REFUSED where it should be:
      #
      #   /api/v0/devices       200 (126 devices dc1, 50 dc2 — a real graph, not an empty one)
      #   /api/v0/alerts        403
      #   /api/v0/logs/eventlog 403
      #   /api/v0/rules         403
      #   DELETE /api/v0/devices/<id>  403
      #
      # The empty-graph trap is why the device count is quoted beside the refusals. The first version of
      # the scoped role passed every 403 and returned ZERO devices, because LibreNMS gates the device LIST
      # on per-device visibility separately from the route policy. It looked perfectly scoped and would
      # have blinded the blast-radius gate — swapping this ticket's risk for the one TG-331 just closed.
      #
      # FALLING BACK to the triage value is deliberate. Unset, this plane keeps its graph and loses only
      # the credential scoping; empty, it loses the graph, and a mutation gate reasoning over an empty
      # graph cannot refuse. The lesser failure is the unscoped token — but SILENCE about it is not
      # acceptable, so the boot log names the fallback and compose_topology_scope_test.go pins the repo
      # side. Do not "simplify" this back into one shared value.
      TG_LIBRENMS_DEPLOYMENTS: ${TG_LIBRENMS_DEPLOYMENTS_TOPOLOGY:-${TG_LIBRENMS_DEPLOYMENTS:-}}
      # THE NETBOX OBJECT GRAPH IS *NOT* WIRED HERE, AND THE ATTEMPT IS RECORDED (TG-346).
      #
      # tg_estate_edges shipped and read 392 on triage, 17 here, sources_failed 0 on both — the plane that
      # starts and stops guests computing blast radius over 4% of the estate the triage plane models.
      # credential_plane.go's exception names "NetBox/PVE object graph" in its own text, so adding NetBox
      # here looked like applying the documented exception to a source it was written for.
      #
      # IT TOOK THE ACTUATION WORKER DOWN. The plane split is enforced on the SECRET REFERENCE, not on the
      # env-key name, and secret/data/tg/netbox is classified read-triage:
      #
      #   credential plane split (REQ-2203, TG-153): this process declared TG_CREDENTIAL_PLANE=actuation
      #   but was handed the READ-TRIAGE reference "bao:secret/data/tg/netbox#token" — the actuation
      #   process must hold nothing beyond what mutates the estate, or a compromise of it also yields the
      #   read plane
      #
      # The guard is right and it FAILS CLOSED, which is why this cost a restart rather than a silent
      # widening of the plane split. TG_NETBOX_URL being absent from triagePlaneEnvKeys is not permission:
      # that list names env KEYS, and the reference classifier is the authority.
      #
      # Closing the 17-vs-392 gap needs a credential this plane may legitimately hold — a NetBox token
      # classified for the actuation plane, or a topology-scoped one on its own path, in the shape TG-337
      # used for LibreNMS. It is not a compose line. Tracked on TG-346.
      LIBRENMS_NL_TOKEN: ${LIBRENMS_NL_TOKEN:-}
      LIBRENMS_GR_TOKEN: ${LIBRENMS_GR_TOKEN:-}
      TG_LIBRENMS_INSECURE: ${TG_LIBRENMS_INSECURE:-}
      TG_ESTATE_DECLARED_FILE: ${TG_ESTATE_DECLARED_FILE:-}
      TG_ESTATE_REFRESH_INTERVAL: ${TG_ESTATE_REFRESH_INTERVAL:-5m}
      TG_POSTURE_PUBLISH_INTERVAL: ${TG_POSTURE_PUBLISH_INTERVAL:-30s}
      TG_KNOWLEDGE_FILE: ${TG_KNOWLEDGE_FILE:-/knowledge/corpus.maintained.json}
      TG_KNOWLEDGE_SEED_FILE: ${TG_KNOWLEDGE_SEED_FILE:-/knowledge/corpus.seed.json}
    # /secrets holds the actuation key material; /knowledge is READ-ONLY here — the triage worker is the
    # single writer of the maintained corpus, and two writers would race the learning loop.
    volumes:
      - ./secrets:/secrets:ro
      - ./knowledge:/knowledge:ro
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      secrets-perms:
        condition: service_completed_successfully
    # TG-160 EGRESS: the actuation plane reaches the estate to MUTATE it — SSH to the target hosts, the PVE
    # API, the AWX job lane — plus OpenBao for its own AppRole. All off-host. It publishes no port (its
    # /halt + /metrics live on :8445 inside the stack). It is behind the `split-planes` profile and is not
    # started by default, which changes nothing about the declaration it owes: a service that is inert today
    # is a service somebody turns on later, and this table exists because one arrived unexamined once.
    networks:
      tg-backplane: {}
      tg-egress:
        # Pinned (TG-381): source-exempt in the host-side TG-EGRESS-LAN chain, same as `worker` above.
        ipv4_address: 172.23.0.11

  # The operator console (spec/010): a read-only React SPA served by nginx, proxying /api to the grounder.
  # Published on 8080 so http://<host>:8080 shows the console. The static bundle carries no secret; the API
  # it calls stays auth-gated (an unauthenticated browser resolves to the console's restrictive state).
  console:
    image: ${TG_CONSOLE_IMAGE:-registry-github.com/territory-grounder/grounder/console}:${TG_TAG:-latest}
    # Container hardening (TG-289 — the gap the first hardening pass inverted). The earlier pass (TG-153
    # gap #9) hardened worker, grounder and litellm and left THIS service — the only one published on
    # 0.0.0.0, i.e. the only one an unauthenticated host on the network can reach — at docker defaults:
    # live `docker inspect` on dc1tg01 read RO=False CapDrop=None SecOpt=None with `root 1 nginx:
    # master process`. So the internal services were constrained and the front door was not.
    #
    # Posture now matches worker/grounder exactly: non-root, ALL capabilities dropped (nothing added
    # back — the listen port moved to 8080 inside the container so no CAP_NET_BIND_SERVICE is needed),
    # no privilege escalation, read-only rootfs. The single writable path is a tmpfs at /var/cache/nginx,
    # which holds nginx's proxy/client temp dirs AND its pid file (relocated there by the Dockerfile).
    # The published port is unchanged (host 8080), so the HTTPS front and every operator URL still work.
    # The image and this file ship from the same commit (TG_TAG), so the two never drift apart.
    user: "101:101" # nginx uid/gid in nginx:1.27-alpine
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: ["/var/cache/nginx"]
    build:
      context: ..
      dockerfile: deploy/console/Dockerfile
    depends_on:
      - grounder
    ports:
      - "8080:8080" # operator console — reachable on the network at http://<host>:8080
    # TG-160: nginx serves a static bundle and proxies /api to `grounder:8080` (deploy/console/nginx.conf,
    # the file's only proxy_pass). It has no reason to reach anything off-box. It is ALSO the only service
    # published on 0.0.0.0 — the one an unauthenticated host on the network can reach — so it is the most
    # likely first foothold and the one where "compromised, and now it can dial out" matters most. Frontdoor:
    # reachable, cannot reach out.
    networks: [tg-backplane, tg-frontdoor]

  # --- Phase-2 canary monitoring: Prometheus scrape + Alertmanager + Grafana. READ-ONLY: they scrape the
  # grounder/worker /metrics; nothing here can mutate a managed estate. The load-bearing alert is
  # ActuationPermittedWhileModeForbidsIt (tg_may_actuate == 1 while the declared mode is non-actuating or
  # unreadable) — it pages immediately. Prometheus + Alertmanager are the required minimum; Grafana renders
  # the safety gauges.
  prometheus:
    image: prom/prometheus:v2.54.1@sha256:f6639335d34a77d9d9db382b92eeb7fc00934be8eae81dbc03b31cfe90411a94
    # Container hardening (TG-289). Full posture, same as worker/grounder/console: the image already runs
    # nobody, its config mounts are :ro, and its ONLY writable state is the promdata volume at /prometheus
    # — a volume, so it stays writable under a read-only rootfs. Measured under this exact posture: the
    # TSDB created /prometheus/data and the log carried 0 permission errors.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - promdata:/prometheus
    depends_on:
      - grounder
      - worker
    ports:
      - "127.0.0.1:9090:9090" # Prometheus UI — localhost only
    # TG-160: every scrape target in deploy/monitoring/prometheus.yml is in-stack (grounder:8080,
    # worker:8444, alertmanager:9093, localhost:9090). Frontdoor for the published UI.
    # IF YOU ADD AN OFF-HOST SCRAPE TARGET (an estate node_exporter, a remote_write endpoint), this service
    # needs tg-egress — add it here AND to deploy/egress_parity_test.go, which will otherwise fail.
    # tg-egress IS REQUIRED, and it is required by one target: opus-sidecar at dc1claude01:8094.
    #
    # tg-backplane is `internal: true` (no gateway at all) and tg-frontdoor runs with
    # com.docker.network.bridge.enable_ip_masquerade=false, so a packet leaving this container keeps its
    # 172.22.x source and the destination host has no route back. Measured 2026-08-06: the scrape timed out
    # after exactly 10.0s, BY RAW IP as well as by name, while the same GET from the TG host returned 200 in
    # 2ms. SidecarDown — severity CRITICAL, the only such alert TG raises about its own single brain — had
    # been firing all day against a healthy sidecar, which is the alert that teaches an operator to ignore
    # criticals.
    #
    # This is the file's OWN convention, not a new posture: grounder, litellm, litellm-secrets, worker and
    # worker-actuate all carry tg-egress for exactly this reason. A monitoring container that may only scrape
    # inside the compose project cannot monitor anything TG depends on that lives outside it.
    #
    # ...AND IT IS GIVEN BACK (TG-413/TG-324). Everything above is still true about WHY the grant was made;
    # it simply no longer applies, because the one off-host target that earned it — the Opus sidecar on
    # dc1claude01:8094 — is now a compose service on this box. prometheus.yml has no remote_write and no
    # other external target, so this scraper's entire reason to leave the host went with the migration.
    #
    # Removing it rather than leaving it is the point. An egress grant nobody needs is indistinguishable
    # from one somebody does, and deploy/egress_parity_test.go requires every grant to carry an enumerated
    # reason — a grant whose stated reason has become false is worse than an undocumented one, because it
    # reads as reviewed. TestEveryOffHostScrapeTargetHasAPathToIt is the guard that would catch a future
    # off-host target being added back without the network to reach it.
    networks: [tg-backplane, tg-frontdoor]

  alertmanager:
    image: prom/alertmanager:v0.27.0@sha256:e13b6ed5cb929eeaee733479dce55e10eb3bc2e9c4586c705a4e8da41e5eacf5
    # Container hardening (TG-289). Caps + no-new-privileges only; read_only is deliberately NOT set.
    # Alertmanager writes its notification/silence log to `data/` under its workdir /alertmanager, and that
    # path cannot be made writable here: a tmpfs whose target EXISTS in the image inherits the image dir's
    # MODE and is reset to root:root, and this daemon (20.10.24) IGNORES a `mode=` option on such a target
    # — measured, the process died with `Unable to create data directory: mkdir data/: permission denied`.
    # Fixing it properly means giving alertmanager a named volume; that is a storage change, not hardening,
    # so it is left to its own ticket rather than smuggled in here.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:9093:9093" # Alertmanager UI — localhost only
    # TG-160: the SHIPPED receiver is the empty sink (deploy/monitoring/alertmanager.yml — "self-contained
    # by default … alerts are visible in the Alertmanager UI"), so as configured in this repo it sends
    # nowhere and needs no route off the box.
    # THIS IS THE ONE MOST LIKELY TO NEED MOVING. The moment a deployment wires a real webhook / Matrix /
    # Slack / PagerDuty receiver, this service needs tg-egress or those pages silently stop leaving the
    # host. Add it here AND to deploy/egress_parity_test.go; the test fails if the two disagree, which is
    # the point — egress must be a declaration, never a side effect of editing a receiver block.
    networks: [tg-backplane, tg-frontdoor]

  grafana:
    image: grafana/grafana:11.2.0@sha256:408afb9726de5122b00a2576763a8a57a3c86d5b0eff5305bc994ceb3eb96c3f
    # Container hardening (TG-289). Caps + no-new-privileges; read_only is NOT set — Grafana unpacks and
    # writes plugin state under /usr/share/grafana on its rootfs, so a read-only rootfs would need a tmpfs
    # per plugin path and was not attempted. Verified booting clean under the two settings kept here.
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3000:3000" # Grafana UI — localhost only
    # TG-160: Grafana's only datasource is the in-stack Prometheus and no plugins are installed
    # (GF_INSTALL_PLUGINS is unset), so it needs no route off the box. Its built-in update check will now
    # fail; that is a log line, not a fault. Frontdoor for the published UI.
    networks: [tg-backplane, tg-frontdoor]

volumes:
  pgdata:
  temporaldata:
  promdata:
  grafanadata:
