      # --- Retrieval plane (precedent RAG, spec/012): the corpus file + the semantic pgvector channel. ---
      # The corpus path is INSIDE the container — bind-mount the corpus (compose override) when enabling.
      # Semantic retrieval additionally needs TG_EMBED_MODEL served by the litellm gateway (see the
      # commented embedding example in litellm-config.yaml) and rides on TG_DB_DSN above; unset it stays
      # honestly disabled and retrieval is the transparent lexical ranking.
      # The worker READS the union of the read-only tracked seed (deploy-synced bootstrap precedents)
      # and the untracked maintained corpus it alone WRITES — the split is what makes runtime learning
      # survive a deploy (the deploy's copy overwrites tracked files, never untracked destination files).
      TG_KNOWLEDGE_FILE: ${TG_KNOWLEDGE_FILE:-/knowledge/corpus.maintained.json}
      # The wiki compiler lane: writes the per-host article envelope the grounder serves.
      TG_WIKI_ARTICLES_FILE: ${TG_WIKI_ARTICLES_FILE:-/knowledge/wiki.articles.json}
      TG_WIKI_COMPILE_INTERVAL: ${TG_WIKI_COMPILE_INTERVAL:-30m}
      # The world-model discovery/drift pass. It DRAFTS what the estate sources see and marks STALE what
      # disappeared; a draft materializes nothing until an operator approves it, and a disappearance never
      # retires a grant.
      #
      # 30m, chosen against the one number that actually bounds this: TG_ESTATE_REFRESH_INTERVAL above runs
      # the SAME sources every 5m. The first cadence here was 6h on a "do not hammer the APIs" argument that
      # those 5m refreshes had already falsified 72x over. What the interval really costs is LATENCY — how
      # long a newly-appeared host waits before an operator can approve it — and DraftEntry is an upsert, so
      # running more often adds no rows. 30m is 10 minutes of API work per day against a 6h blind spot.
      TG_WORLD_DISCOVERY_INTERVAL: ${TG_WORLD_DISCOVERY_INTERVAL:-30m}
      # How often the seam-YIELD register re-reports. The manifest says whether a seam was BOUND at boot;
      # this says whether a bound seam has PRODUCED anything since. 0 silences the log line but never the
      # register — the gauges stay live for a dashboard either way.
      TG_WIRING_YIELD_INTERVAL: ${TG_WIRING_YIELD_INTERVAL:-30m}
      # The SERVICE-OBSERVING discovery probes (spec/027 plane 2). Both host lists ship EMPTY: the probes
      # are read-only but they do open an SSH session per host, so an operator arms them deliberately.
      # Empty ⇒ no probe is constructed and the discovery.service seam declares why in the boot report.
      TG_DISCOVERY_SYSTEMD_HOSTS: ${TG_DISCOVERY_SYSTEMD_HOSTS:-}
      TG_DISCOVERY_DOCKER_HOSTS: ${TG_DISCOVERY_DOCKER_HOSTS:-}
      # Mandatory once a host list is set: an empty path yields a runner that REFUSES every read rather
      # than one that skips host-key verification.
      TG_DISCOVERY_KNOWN_HOSTS: ${TG_DISCOVERY_KNOWN_HOSTS:-}
      TG_DISCOVERY_TIMEOUT: ${TG_DISCOVERY_TIMEOUT:-15s}
      TG_KNOWLEDGE_SEED_FILE: ${TG_KNOWLEDGE_SEED_FILE:-/knowledge/corpus.seed.json}
      TG_KNOWLEDGE_REFRESH_INTERVAL: ${TG_KNOWLEDGE_REFRESH_INTERVAL:-}
      TG_LESSONS_SOURCE_FILE: ${TG_LESSONS_SOURCE_FILE:-}
      TG_LESSONS_REFRESH_INTERVAL: ${TG_LESSONS_REFRESH_INTERVAL:-}
      # Recency/decay reconciliation (spec/018): TG_LESSONS_MAX_AGE (blank ⇒ 0 = pruning OFF) is the retention
      # horizon past which a lesson's provenance ages it out of the corpus, fired by the decay cron below.
      TG_LESSONS_MAX_AGE: ${TG_LESSONS_MAX_AGE:-}
      # TG-52 Reflexion caution lane: the failed-trajectory counterpart to the lessons feed. Blank ⇒ dormant
      # (no caution corpus); a distinct path arms it (knowledge_corpus.go REFUSES to share TG_KNOWLEDGE_FILE's
      # path — fail-closed). A caution NEVER becomes a learned-match precedent (Source=ProvenanceCaution).
      TG_CAUTION_FILE: ${TG_CAUTION_FILE:-}
      # Tracker-history import lane (TG-244): the COMPOUNDING sibling of the lessons feed. All blank ⇒ the
      # seam stays dark (needs a history-capable tracker AND a durable corpus to arm); blanks fall back to
      # the code defaults (limit 20, timeout 2m, no re-import ticker).
      TG_TRACKER_IMPORT_LIMIT: ${TG_TRACKER_IMPORT_LIMIT:-}
      TG_TRACKER_IMPORT_TIMEOUT: ${TG_TRACKER_IMPORT_TIMEOUT:-}
      TG_TRACKER_IMPORT_INTERVAL: ${TG_TRACKER_IMPORT_INTERVAL:-}
      TG_EMBED_MODEL: ${TG_EMBED_MODEL:-}
      TG_EMBED_DIM: ${TG_EMBED_DIM:-}
      TG_EMBED_MIN_SIMILARITY: ${TG_EMBED_MIN_SIMILARITY:-}
      # TG-50: the LEXICAL min-relevance floor (companion to the semantic TG_EMBED_MIN_SIMILARITY above). EMPTY
      # / ≤0 = OFF (the shipped score>0 behaviour, byte-identical); a positive value trims the low-relevance
      # lexical tail (same-rule-only noise) the cosine floor cannot see.
      TG_RETRIEVE_MIN_SCORE: ${TG_RETRIEVE_MIN_SCORE:-}
      # TG-50: render the retrieved precedent block as XML rather than the plain-text list. EMPTY/false = OFF
      # (the shipped plain-text rendering, byte-identical); true = XML-delimited (clearer data/instruction
      # separation for the model). A prompt-surface change — arming is validated by the eval gate.
      TG_RETRIEVE_XML_CONTEXT: ${TG_RETRIEVE_XML_CONTEXT:-}
      # TG-50: deterministic multi-query retrieval — retrieve over rule-broadened query variants + RRF-fuse.
      # EMPTY/false = OFF (base retriever served directly, byte-identical); true = extra recall from the
      # broadened variant (most valuable over the semantic-fused base). A prompt-surface change — eval-gated.
      TG_RETRIEVE_MULTIQUERY: ${TG_RETRIEVE_MULTIQUERY:-}
      # TG-50: LLM QUERY-REWRITE — reformulate the incident into a crisp retrieval query with a fast model, then
      # run the whole retrieval stack on the rewrite. EMPTY/false = OFF (raw query, byte-identical); a MODEL CALL
      # in the retrieval hot path (latency), so armed only by operator choice. MODEL selects the fast completer.
      TG_RETRIEVE_QUERY_REWRITE: ${TG_RETRIEVE_QUERY_REWRITE:-}
      TG_QUERY_REWRITE_MODEL: ${TG_QUERY_REWRITE_MODEL:-}
      # TG-50: cross-encoder RERANK — retrieve wide, rerank to a precise top-k via the TEI reranker. UNSET = OFF
      # (base ranking, byte-identical); a URL arms it, WIDEN sets the wide candidate count. The endpoint host is
      # deploy config, never a committed estate hostname. Retrieval is eval-INERT to the LLM-judge gate.
      TG_RERANK_URL: ${TG_RERANK_URL:-}
      TG_RERANK_WIDEN: ${TG_RERANK_WIDEN:-}
      # TG-53: incident-knowledge GraphRAG — broaden retrieval by the alerting host's estate blast radius + RRF.
      # EMPTY/false = OFF (base retriever, byte-identical); true arms it, MAX_HOSTS/DEPTH bound the walk.
      # DO NOT ARM until graph edge-precision (TG-352) lands — today's graph over-returns from hub nodes.
      TG_RETRIEVE_GRAPH_PRECEDENT: ${TG_RETRIEVE_GRAPH_PRECEDENT:-}
      TG_RETRIEVE_GRAPH_MAX_HOSTS: ${TG_RETRIEVE_GRAPH_MAX_HOSTS:-}
      TG_RETRIEVE_GRAPH_DEPTH: ${TG_RETRIEVE_GRAPH_DEPTH:-}
      # TG-214: HyDE — embed a hypothetical resolution as a document to match precedent resolutions. A MODEL CALL
      # in the retrieval hot path (latency), hence OFF by default; MODEL selects the fast completer alias.
      TG_RETRIEVE_HYDE: ${TG_RETRIEVE_HYDE:-}
      TG_HYDE_MODEL: ${TG_HYDE_MODEL:-}
      # TG-214: retrieval-sufficiency (CRAG) — render an explicit "no adequate precedent" when the kept set is weak
      # instead of padding with off-target hits. EMPTY/false = OFF (byte-identical); MIN_COSINE tunes the bar.
      TG_RETRIEVE_SUFFICIENCY: ${TG_RETRIEVE_SUFFICIENCY:-}
      TG_RETRIEVE_SUFFICIENCY_MIN_COSINE: ${TG_RETRIEVE_SUFFICIENCY_MIN_COSINE:-}
      # TG-86 slice 2b: fold the operator's own host docs into the <estate> grounding block (screened like other
      # untrusted data). EMPTY/false = OFF (byte-identical). Arming is gated on the TG-486 identifier-redaction pass.
      TG_ESTATE_DOC_SEED: ${TG_ESTATE_DOC_SEED:-}
      # TG-508: IDF-weight the retrieval tag channel — a rare curated tag-set outranks a boilerplate one.
      # EMPTY/false = OFF (shipped flat weightTag*Jaccard, byte-identical); true = tag-rarity (IDF) weighting.
      # Retrieval is eval-INERT to the LLM-judge gate; arming is validated by eval/retrieval resolution-recall.
      TG_RETRIEVAL_IDF_TAGS: ${TG_RETRIEVAL_IDF_TAGS:-}
      TG_EMBED_BACKFILL_INTERVAL: ${TG_EMBED_BACKFILL_INTERVAL:-}
      TG_EMBED_BACKFILL_BATCH: ${TG_EMBED_BACKFILL_BATCH:-}
      # =================================================================================================
      # Env-parity passthroughs (fix/compose-env-parity). Every knob below is read by cmd/worker/main.go
      # via the getenv family but was NOT previously forwarded here — so an operator override in .env was
      # silently dropped and the worker ran on its in-code default (the exact prod-gap class this branch
      # kills). Token knobs are secret REFERENCES (env:NAME) with the referenced secret passed alongside
      # as ${NAME:-} (never a literal value). All optional: unset ⇒ in-code default / feature-off.
      # deploy/envparity_test.go fails CI if any read key here regresses. Mutation stays OFF regardless.
      # --- Gate inputs: blast-radius width (default 8), criticality tiers, self-protected services ---
      TG_BLAST_RADIUS_WIDE_THRESHOLD: ${TG_BLAST_RADIUS_WIDE_THRESHOLD:-8}
      TG_CRITICALITY_TIER_HOSTS: ${TG_CRITICALITY_TIER_HOSTS:-}
      TG_SELF_PROTECTED_SERVICES: ${TG_SELF_PROTECTED_SERVICES:-}
      # Prior-verdict poll lookback (spec/001 REQ-015): a same-rule-family DEVIATION inside this window
      # POLL_PAUSEs the next action on that target. Empty ⇒ the in-code default (48h).
      TG_PRIOR_VERDICT_WINDOW: ${TG_PRIOR_VERDICT_WINDOW:-}
      # Incident correlation window (TG-169): how far either side of an alert's arrival the correlation stage
      # looks for co-occurring alerts when deciding whether an incident spans MULTIPLE systems (and therefore
      # takes the deep path). Only the SPAN is tunable — how fast this estate's failures propagate is a
      # property of the estate; the cluster thresholds are constants in core/correlate, because a knob able to
      # lower them is a way back to the `severity == critical` state this replaced. Empty ⇒ in-code default (10m).
      TG_CORRELATION_WINDOW: ${TG_CORRELATION_WINDOW:-}
      # Staged-canary allowlist file (REQ-009): a (host,op) here is FORCED to POLL_PAUSE (human vote). Empty ⇒ inert.
      TG_CANARY_POLL_POLICY_FILE: ${TG_CANARY_POLL_POLICY_FILE:-}
      # --- Estate: declared/tunnel/learned topology files, per-source cascade-alert names, poll interval,
      # expected-capabilities reconcile. Cascade defaults preserved so an empty passthrough can't blank them. ---
      TG_ESTATE_DECLARED_FILE: ${TG_ESTATE_DECLARED_FILE:-}
      TG_ESTATE_TUNNEL_FILE: ${TG_ESTATE_TUNNEL_FILE:-}
      TG_ESTATE_LEARNED_FILE: ${TG_ESTATE_LEARNED_FILE:-}
      TG_NETBOX_CASCADE_ALERT: ${TG_NETBOX_CASCADE_ALERT:-HostDown}
      TG_LIBRENMS_CASCADE_ALERT: ${TG_LIBRENMS_CASCADE_ALERT:-DeviceDown}
      TG_PVE_CASCADE_ALERT: ${TG_PVE_CASCADE_ALERT:-HostDown}
      TG_SLURPIT_CASCADE_ALERT: ${TG_SLURPIT_CASCADE_ALERT:-DeviceDown}
      TG_LIBRENMS_ALERT_POLL_INTERVAL: ${TG_LIBRENMS_ALERT_POLL_INTERVAL:-}
      TG_LIBRENMS_ALERT_POLL_MIN_AGE: ${TG_LIBRENMS_ALERT_POLL_MIN_AGE:-}
      TG_EXPECTED_CAPABILITIES: ${TG_EXPECTED_CAPABILITIES:-}
      # --- Estate-doc GROUNDING (TG-86 slice 1c: ARM). The worker's boot coverage job
      # (cmd/worker/estate_doc_coverage.go) reads BOTH of these via getenv, but before this block NEITHER was
      # forwarded — so an operator override in .env was silently discarded and the live tg_estate_doc_* gauges
      # read empty (tg_estate_doc_files an empty vector: the arming oracle stuck RED). That is the TG-384
      # compose-parity class exactly: a feature reachable in code, inert in prod on a blank compose default.
      # It is now guarded from BOTH sides — deploy/envparity_test.go scans estate_doc_coverage.go for parity,
      # and deploy/compose_estate_doc_corpus_test.go pins the safe-default shape below.
      #
      # ALL DEFAULT EMPTY, so a stack that does not opt in is byte-for-byte unchanged (honest absence, the
      # TG-394 self-dep discipline): DOCS_DIR unset ⇒ the coverage job emits nothing (no phantom zero-gauges);
      # CORPUS unset ⇒ no corpus is persisted. ARMING is setting them — mount a documentation root at
      # DOCS_DIR to light coverage, and point CORPUS at a file under the ./knowledge mount (already
      # bind-mounted below) to persist the corpus for the slice-2 retriever. PERSISTING from a DOCS_DIR walk
      # additionally requires REDACT_PATTERNS (mount github-sync/denylist.txt + scripts/estate-redact-extra.txt
      # and list them comma-separated): without it the walk is secret-scrubbed but identifier-LADEN, and the
      # worker REFUSES the write (TG-486 — the offline scripts/estate-docs-corpus.sh is the gated alternative).
      TG_ESTATE_DOCS_DIR: ${TG_ESTATE_DOCS_DIR:-}
      TG_ESTATE_DOC_CORPUS: ${TG_ESTATE_DOC_CORPUS:-}
      TG_ESTATE_DOC_REDACT_PATTERNS: ${TG_ESTATE_DOC_REDACT_PATTERNS:-}
      # --- Actuation (SSH). Inert while mutation is OFF (the interceptor refuses before executing). The
      # native in-process crypto/ssh runner verifies each target host key against KNOWN_HOSTS and authenticates
      # with the KEY reference (env:/file:); both empty ⇒ the runner fails closed (no unverified connection). ---
      TG_ACTUATION_SSH_HOST: ${TG_ACTUATION_SSH_HOST:-}
      TG_ACTUATION_SSH_IDENTITY: ${TG_ACTUATION_SSH_IDENTITY:-}
      TG_ACTUATION_SSH_KNOWN_HOSTS: ${TG_ACTUATION_SSH_KNOWN_HOSTS:-}
      TG_ACTUATION_SSH_KEY: ${TG_ACTUATION_SSH_KEY:-}
      # TG-423: OpenBao ssh CA/signed-cert auth for actuation. EMPTY TG_SSHCA_ADDR = OFF (default) ⇒ actuations
      # present the static TG_ACTUATION_SSH_KEY exactly as before — behaviour-preserving, safe to merge. ARMED
      # by setting the address + a sign role + a token ref: each actuation then presents a short-lived
      # OpenBao-signed CERTIFICATE the target trusts via TrustedUserCAKeys, so the exposure window becomes the
      # cert TTL. A set-but-unconstructable engine fails the worker boot CLOSED (never falls back to the key).
      # Arming also needs the estate step: roll the CA public key into each target sshd's TrustedUserCAKeys.
      TG_SSHCA_ADDR: ${TG_SSHCA_ADDR:-}
      TG_SSHCA_MOUNT: ${TG_SSHCA_MOUNT:-}
      TG_SSHCA_ROLE: ${TG_SSHCA_ROLE:-}
      TG_SSHCA_TOKEN_REF: ${TG_SSHCA_TOKEN_REF:-}
      TG_SSHCA_CA: ${TG_SSHCA_CA:-}
      TG_ACTUATION_ALLOWED_UNITS: ${TG_ACTUATION_ALLOWED_UNITS:-}
      TG_ACTUATION_ALLOWED_CONTAINERS: ${TG_ACTUATION_ALLOWED_CONTAINERS:-}
      # Per-target actuation (spec/017 REQ-1717, P3-B2): OFF ⇒ the native-ssh lane binds one leaf to the single
      # TG_ACTUATION_SSH_HOST above (default, behaviour-preserving). ON ⇒ each action's leaf binds to its OWN
      # target host (fleet restart/start-service) via the actuation identity+key above over KNOWN_HOSTS. Stays
      # dormant until the mode is flipped to actuate AND the allowed-units allowlist is non-empty.
      TG_ACTUATION_SSH_PER_TARGET: ${TG_ACTUATION_SSH_PER_TARGET:-}
      # --- Credential/identity engine (spec/016), instantiated LIVE + syncing from the real systems-of-record.
      # Each source's TRIGGER (its address / URL list) gates whether it is built; absent ⇒ that source is off.
      # A present-but-PARTIAL source config fails the worker boot CLOSED. Every credential is a SecretRef
      # reference (env:NAME / file:), never a literal; the referenced secret is passed alongside as ${NAME:-}.
      # SYNC_INTERVAL gates the scheduled re-sync (OFF by default; an initial sync always runs at boot).
      # Coverage + sync state (NON-SECRET) are published to migration-0017 tables for the console. Mutation OFF.
      TG_CREDENTIAL_NATIVE_RULES: ${TG_CREDENTIAL_NATIVE_RULES:-}
      TG_CREDENTIAL_SYNC_INTERVAL: ${TG_CREDENTIAL_SYNC_INTERVAL:-}
      TG_MODULE_PROBE_INTERVAL: ${TG_MODULE_PROBE_INTERVAL:-}
      # OpenBao / HashiCorp Vault (machine plane, KV v2). AUTH_METHOD ∈ token|approle|jwt (default token).
      TG_OPENBAO_ADDR: ${TG_OPENBAO_ADDR:-}
      TG_OPENBAO_SOURCE_ID: ${TG_OPENBAO_SOURCE_ID:-}
      TG_OPENBAO_AUTH_METHOD: ${TG_OPENBAO_AUTH_METHOD:-}
      TG_OPENBAO_TOKEN_REF: ${TG_OPENBAO_TOKEN_REF:-}
      TG_OPENBAO_ROLE_ID_REF: ${TG_OPENBAO_ROLE_ID_REF:-}
      TG_OPENBAO_SECRET_ID_REF: ${TG_OPENBAO_SECRET_ID_REF:-}
      # Secret-zero-free bootstrap (spec/024 REQ-2407, TG_OPENBAO_AUTH_METHOD=wrapped-approle): a single-use
      # response-wrapping token on tmpfs (file:/run/tg/bao-wrap) — no durable secret_id on disk.
      TG_OPENBAO_WRAP_TOKEN_REF: ${TG_OPENBAO_WRAP_TOKEN_REF:-}
      TG_OPENBAO_JWT_REF: ${TG_OPENBAO_JWT_REF:-}
      TG_OPENBAO_JWT_ROLE: ${TG_OPENBAO_JWT_ROLE:-}
      # mTLS machine-identity bootstrap (spec/024 Amendment 2026-07-25): set CERT+KEY to a FreeIPA-CA client
      # cert+key path to authenticate with NO bootstrap token; empty ⇒ fall back to TG_OPENBAO_TOKEN_REF
      # (transition-safe deploy switch). CERT_ROLE names the OpenBao cert auth role (optional).
      TG_OPENBAO_CERT: ${TG_OPENBAO_CERT:-}
      TG_OPENBAO_KEY: ${TG_OPENBAO_KEY:-}
      TG_OPENBAO_CERT_ROLE: ${TG_OPENBAO_CERT_ROLE:-}
      TG_OPENBAO_CA: ${TG_OPENBAO_CA:-}
      TG_OPENBAO_KV_MOUNT: ${TG_OPENBAO_KV_MOUNT:-}
      TG_OPENBAO_KV_PREFIX: ${TG_OPENBAO_KV_PREFIX:-}
      OPENBAO_TOKEN: ${OPENBAO_TOKEN:-}
      OPENBAO_ROLE_ID: ${OPENBAO_ROLE_ID:-}
      OPENBAO_SECRET_ID: ${OPENBAO_SECRET_ID:-}
      # AWX (machine plane, inventory). TOKEN_REF is required when ADDR is set (Bearer OAuth2 token reference).
      TG_AWX_ADDR: ${TG_AWX_ADDR:-}
      TG_AWX_SOURCE_ID: ${TG_AWX_SOURCE_ID:-}
      TG_AWX_TOKEN_REF: ${TG_AWX_TOKEN_REF:-env:AWX_TOKEN}
      TG_AWX_CA: ${TG_AWX_CA:-}
      TG_AWX_INVENTORY_ID: ${TG_AWX_INVENTORY_ID:-}
      TG_AWX_REF_SCHEME: ${TG_AWX_REF_SCHEME:-}
      TG_AWX_REF_PREFIX: ${TG_AWX_REF_PREFIX:-}
      TG_AWX_REF_FIELD: ${TG_AWX_REF_FIELD:-}
      # Job-template mode: map each AWX Machine-credential NAME to a sealed SecretRef TG holds locally
      # (';'-separated "AWX cred name=SecretRef"). Unset ⇒ the job-template walk does not run (host-only).
      TG_AWX_CRED_REF_MAP: ${TG_AWX_CRED_REF_MAP:-}
      TG_AWX_DEFAULT_USER: ${TG_AWX_DEFAULT_USER:-}
      AWX_TOKEN: ${AWX_TOKEN:-}
      # Semaphore (machine plane, inventory). TOKEN_REF is required when ADDR is set (Bearer API token reference).
      TG_SEMAPHORE_ADDR: ${TG_SEMAPHORE_ADDR:-}
      TG_SEMAPHORE_SOURCE_ID: ${TG_SEMAPHORE_SOURCE_ID:-}
      TG_SEMAPHORE_TOKEN_REF: ${TG_SEMAPHORE_TOKEN_REF:-${SEMAPHORE_TOKEN:+env:SEMAPHORE_TOKEN}}
      TG_SEMAPHORE_CA: ${TG_SEMAPHORE_CA:-}
      TG_SEMAPHORE_PROJECT_ID: ${TG_SEMAPHORE_PROJECT_ID:-}
      TG_SEMAPHORE_REF_SCHEME: ${TG_SEMAPHORE_REF_SCHEME:-}
      TG_SEMAPHORE_REF_PREFIX: ${TG_SEMAPHORE_REF_PREFIX:-}
      TG_SEMAPHORE_REF_FIELD: ${TG_SEMAPHORE_REF_FIELD:-}
      SEMAPHORE_TOKEN: ${SEMAPHORE_TOKEN:-}
      # UN-CONTROLLED Ansible (machine plane, plain files, NO controller). ROOT (the inventory +
      # group_vars/host_vars directory) gates whether the source is built; a present ROOT with no
      # VAULT_PASS_REF fails the boot closed. TG parses the tree and natively decrypts inline !vault
      # secrets at use time (no ansible CLI). Point ROOT at a directory MOUNTED into this service (e.g.
      # a demo dir) and VAULT_PASS_REF at a sealed password (file:/secrets/... via the ./secrets mount).
      TG_ANSIBLE_ROOT: ${TG_ANSIBLE_ROOT:-}
      TG_ANSIBLE_SOURCE_ID: ${TG_ANSIBLE_SOURCE_ID:-}
      TG_ANSIBLE_INVENTORY: ${TG_ANSIBLE_INVENTORY:-}
      TG_ANSIBLE_VAULT_PASS_REF: ${TG_ANSIBLE_VAULT_PASS_REF:-}
      TG_ANSIBLE_DEFAULT_USER: ${TG_ANSIBLE_DEFAULT_USER:-}
      # LDAP / FreeIPA (human plane, approvers). BIND_DN + BIND_PW are required SecretRefs when URLS is set.
      TG_LDAP_URLS: ${TG_LDAP_URLS:-}
      TG_LDAP_SOURCE_ID: ${TG_LDAP_SOURCE_ID:-}
      # Site base DNs (deploy-time; the estate dc=… suffix is NEVER compiled in — STONITH). Unset ⇒ the
      # binary's generic FreeIPA/389-DS RDN default, which a real deployment overrides with its full suffix.
      TG_LDAP_USER_BASE: ${TG_LDAP_USER_BASE:-}
      TG_LDAP_GROUP_BASE: ${TG_LDAP_GROUP_BASE:-}
      TG_LDAP_BIND_DN: ${TG_LDAP_BIND_DN:-env:LDAP_BIND_DN}
      TG_LDAP_BIND_PW: ${TG_LDAP_BIND_PW:-env:LDAP_BIND_PW}
      TG_LDAP_CA: ${TG_LDAP_CA:-}
      TG_LDAP_STARTTLS: ${TG_LDAP_STARTTLS:-}
      # (TG_LDAP_USER_BASE / TG_LDAP_GROUP_BASE are defined once above — the attribution identity resolver
      # spec/023 REQ-2315 reuses the same site base DNs.)
      LDAP_BIND_DN: ${LDAP_BIND_DN:-}
      LDAP_BIND_PW: ${LDAP_BIND_PW:-}
      # OIDC client-credentials token minter (machine plane, oidc: SecretRef scheme, REQ-1619). TOKEN_URL
      # present ⇒ the oidc: resolver is wired; CLIENT_ID_REF + CLIENT_SECRET_REF are required SecretRefs (the
      # client_secret is sealed under ./secrets, referenced file:/secrets/…). Resolver-only (mints at use
      # time, no Sync source). Absent TOKEN_URL ⇒ the capability is off.
      TG_OIDC_TOKEN_URL: ${TG_OIDC_TOKEN_URL:-}
      TG_OIDC_CLIENT_ID_REF: ${TG_OIDC_CLIENT_ID_REF:-}
      TG_OIDC_CLIENT_SECRET_REF: ${TG_OIDC_CLIENT_SECRET_REF:-}
      TG_OIDC_SCOPE: ${TG_OIDC_SCOPE:-}
      TG_OIDC_AUDIENCE: ${TG_OIDC_AUDIENCE:-}
      TG_OIDC_CA: ${TG_OIDC_CA:-}
      TG_OIDC_AUTH_STYLE: ${TG_OIDC_AUTH_STYLE:-}
      # --- Falsifiability scoring loop. SCORE_INTERVAL gates the loop; default 5m keeps it ON, so it is
      # passed explicitly (an empty passthrough would silently DISABLE scoring). BATCH falls back to its
      # in-code default (200) when blank.
      # The observation window is LEARNED per edge — max(FLOOR, 2 x p95 observed cascade latency), capped by
      # MAX (spec/002 REQ-110, TG-220). Blank ⇒ the in-code defaults 900s / 2h / 14d, all of which fail safe
      # toward waiting LONGER; nothing here can shorten a window and manufacture a miss. TG_FALSIFIABILITY_WINDOW
      # is RETIRED — still FORWARDED only so the worker can say so loudly at boot instead of ignoring a stale
      # operator setting in silence. ---
      TG_FALSIFIABILITY_SCORE_INTERVAL: ${TG_FALSIFIABILITY_SCORE_INTERVAL:-5m}
      TG_FALSIFIABILITY_WINDOW_FLOOR: ${TG_FALSIFIABILITY_WINDOW_FLOOR:-}
      TG_FALSIFIABILITY_WINDOW_MAX: ${TG_FALSIFIABILITY_WINDOW_MAX:-}
      TG_FALSIFIABILITY_LATENCY_LOOKBACK: ${TG_FALSIFIABILITY_LATENCY_LOOKBACK:-}
      TG_FALSIFIABILITY_WINDOW: ${TG_FALSIFIABILITY_WINDOW:-} # RETIRED — forwarded only for the boot warning
      TG_FALSIFIABILITY_BATCH: ${TG_FALSIFIABILITY_BATCH:-}
      # --- Discovery corpus (design-wisdom #10) + shared recency/decay reconciliation (design-wisdom #11).
