# TG-675 (slice 2, deep-review F17) — tinyproxy config for the litellm -> provider egress proxy. ENFORCING.
#
# The proxy now DENIES every HTTPS CONNECT whose destination is not one of the DEPLOYED provider hosts
# (enforce-filter, derived from provider-allowlist.txt — the fence; see that file for how the set was read
# from the live box on 2026-11-07). Slice 1 (TG-420, 2026-08) observed only; the program's owner prompt
# directed arming default-deny with the deployed set, and the stale TG-488 B11 fence (deepseek/mistral/z.ai as
# the brain) was replaced by the 2026-08-31 model plane (Azure primary/fast; every Claude lane via the
# operator's litellm01 over HTTP). It still logs every CONNECT, so `docker compose logs tg-egress-proxy`
# shows both the permitted destinations and each refusal ("Proxying refused on filtered domain").
#
# WHAT THIS DOES NOT BOUND (stated, not hidden): the HTTP direct lanes — litellm01 (every Claude call), the
# Ollama embed lane, the sidecar — never traverse HTTPS_PROXY, and litellm's own DIRECT public egress is not
# dropped at the host (TG-420 slice 2c had no surviving template after TG-160). The fence binds the traffic
# litellm routes through it; a compromised litellm could still dial out directly. docs/THREAT-MODEL.md §5.3.
#
# MEASURED before shipping (tinyproxy 1.11.2, alpine:3.21, 2026-11-07): with the directives below a CONNECT to
# a fenced host returns 200 and one to an unlisted host is refused with `Proxying refused on filtered domain`
# in the log; `FilterType ere` is the 1.11 spelling (1.10's `FilterExtended On` is gone).
#
# Run as a non-root user (set via compose `user:`), so there is deliberately NO `User`/`Group` directive
# here — tinyproxy does not try to setuid, which is what lets the container drop ALL capabilities.

Port 8888
# Listen on all container interfaces: litellm reaches this over tg-backplane by service name. No host port
# is published in docker-compose.yml, so only in-stack containers can reach it.
Listen 0.0.0.0

Timeout 600
MaxClients 100

# Log every CONNECT destination. With NO LogFile/Syslog directive and the daemon kept in the FOREGROUND
# (-d, set in the Dockerfile ENTRYPOINT), tinyproxy writes its log to stdout, so `docker compose logs
# tg-egress-proxy` captures the per-request `CONNECT <host>:<port>` lines that ARE the observe signal.
# MEASURED on tinyproxy 1.11.2 (Alpine 3.21): `LogFile "/dev/stdout"` is REFUSED by the daemon's
# symlink-race guard ("has been changed before it could be opened"), so foreground-to-stdout is the working
# path — and it writes nothing to the (read-only) rootfs. The prefork StartServers/MinSpareServers/
# MaxSpareServers knobs are OBSOLETE in 1.11 (they warn and are ignored), so they are deliberately absent.
LogLevel Connect

# CLIENT ACL. Only the compose networks (RFC1918) may use the proxy; there is no host port, so this is
# defence in depth. tinyproxy default-denies once any Allow is present.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# THE ENFORCE FILTER (TG-675). enforce-filter holds one anchored extended-regex per fenced HTTPS host —
# `(^|\.)host$` admits the host and its subdomains and NOT host.attacker.example — and FilterDefaultDeny
# refuses every destination that matches none of them. tinyproxy matches the CONNECT target hostname against
# the filter, so a CDN-fronted provider whose IPs rotate stays permitted. No `ConnectPort` restriction: the
# providers are all :443 and a stray port on a fenced host is still that host.
FilterDefaultDeny Yes
Filter "/etc/tinyproxy/enforce-filter"
FilterType ere
#
# The host-side DROP of litellm's direct public egress (so this proxy is the ONLY path out) is still NOT
# done: the DOCKER-USER/TG-EGRESS-LAN pattern was deleted by TG-160 (2026-08-18) because it blocked litellm's
# LAN hop to the operator's litellm01, which TG-293 made load-bearing the same day (every Claude lane dials
# it over HTTP via TG_LITELLM01_BASE). A drop scoped to public destinations only needs a fresh design; until
# then this proxy fences what litellm routes through it, and THREAT-MODEL.md §5.3 says so.
