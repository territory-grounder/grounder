# TG-420 slice 1 — tinyproxy config for the litellm -> provider egress proxy. OBSERVE / LOG-ONLY.
#
# In this (slice 1) posture the proxy BLOCKS NOTHING. It logs the destination of every CONNECT so an
# operator can SEE, from the running box, exactly which hosts litellm dials over HTTPS. Per OWNER RULING
# TG-488 B11 as CORRECTED 2026-08-14 on TG-420 (B11's set missed default-endpoint providers — DeepSeek is
# the JUDGE, Mistral the CURRENT primary brain; blocking them would cut both), the fence is FIVE endpoints
# (see provider-allowlist.txt): sidecar + ollama (HTTP, DIRECT, off this proxy) and api.z.ai +
# api.deepseek.com + api.mistral.ai (the HTTPS endpoints the fence permits). "Log first, then block
# strangers" still governs: observe now; slice 2 blocks whatever the log shows OUTSIDE the corrected
# fence. Do not enable blind — this sits on a single-brain model path.
#
# Run as a non-root user (set via compose `user:`), so there is deliberately NO `User`/`Group` directive
# here — tinyproxy does not try to setuid, which is what lets the container drop ALL capabilities.

Port 8888
# Listen on all container interfaces: litellm reaches this over tg-backplane by service name. No host port
# is published in docker-compose.yml, so only in-stack containers can reach it.
Listen 0.0.0.0

Timeout 600
MaxClients 100

# Log every CONNECT destination. With NO LogFile/Syslog directive and the daemon kept in the FOREGROUND
# (-d, set in the Dockerfile ENTRYPOINT), tinyproxy writes its log to stdout, so `docker compose logs
# tg-egress-proxy` captures the per-request `CONNECT <host>:<port>` lines that ARE the observe signal.
# MEASURED on tinyproxy 1.11.2 (Alpine 3.21): `LogFile "/dev/stdout"` is REFUSED by the daemon's
# symlink-race guard ("has been changed before it could be opened"), so foreground-to-stdout is the working
# path — and it writes nothing to the (read-only) rootfs. The prefork StartServers/MinSpareServers/
# MaxSpareServers knobs are OBSOLETE in 1.11 (they warn and are ignored), so they are deliberately absent.
LogLevel Connect

# CLIENT ACL. Only the compose networks (RFC1918) may use the proxy; there is no host port, so this is
# defence in depth. tinyproxy default-denies once any Allow is present.
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# NO `Filter`/`FilterDefaultDeny` and NO `ConnectPort` restriction here on purpose: slice 1 observes, it
# does not block. The fence definition ships alongside (provider-allowlist.txt) and is CI-checked against the
# owner ruling, so slice 2 is a config flip, not a rewrite.
#
# ============================ SLICE 2 — ENFORCE (OWNER-GATED, NOT IN THIS MR) ============================
# Arm ONLY after the observe drill (deploy/host/tg-egress-proxy-observe-drill.sh) shows completions green and
# the owner has reviewed the stranger list it reports. The fence's DIRECT lanes (sidecar, ollama) are HTTP
# and never traverse this proxy, so enforcement here governs the PROXY-BORNE HTTPS traffic: permit the
# fence's HTTPS endpoints (api.z.ai, api.deepseek.com, api.mistral.ai — the corrected set) and DENY every
# stranger. Write a host-anchored enforce filter from the fence's HTTPS endpoints and turn on default-deny:
#
#   printf '%s\n' '(^|\.)api\.z\.ai$' '(^|\.)api\.deepseek\.com$' '(^|\.)api\.mistral\.ai$' \
#     > /etc/tinyproxy/enforce-filter   # anchored: each admits the domain + subdomains only
#   FilterDefaultDeny Yes
#   Filter "/etc/tinyproxy/enforce-filter"
#   FilterExtended On
#
# (Anchored so api.z.ai matches its subdomains but NOT api.z.ai.attacker.example.) THEN add a host-side
# DROP of litellm's direct public egress so the proxy is the ONLY path out.
# NOTE (2026-08-19): the DOCKER-USER/TG-EGRESS-LAN host-isolation pattern this step used to mirror
# (deploy/host/tg-host-isolation.sh) was DELETED by TG-160 (Won't-fix, 2026-08-18) for blocking litellm's
# LAN reach to dc1litellm01 — a path TG-293 (same day) made LOAD-BEARING: primary/fast/opus-cc/
# arm-haiku/arm-opus/forensic-ir all now dial it via TG_LITELLM01_BASE (litellm-config.yaml). A slice-2
# host-side drop must NOT re-block that hop; there is no surviving template to mirror, so this leg needs a
# fresh, narrower design (e.g. scoped to litellm's known-public-provider destinations only), not a revert.
# provider-allowlist.txt stays the FENCE DEFINITION (the corrected ruled endpoints) that
# egress_proxy_allowlist_test.go checks against the ruling+correction; the enforce filter is DERIVED from
# its HTTPS endpoints (sidecar/ollama need no filter line — they are direct lanes, permitted by NO_PROXY).
# ========================================================================================================
