[package]
name = "claudecode-runner"
version = "1.2.1"
edition = "2021"
description = "omoikane Rust harness invoking `claude -p` against operator Max-20 subscription (no --bare, OAuth-keychain enabled)"
publish = false

[[bin]]
name = "claudecode-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
# `json` (AGRIOPS-208): the human-formatted default is unparseable, so nothing
# could ever consume these logs. SIDECAR_LOG_FORMAT=text restores the old shape.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# Used by /probe-auth for mtime → RFC3339 formatting in the response.
time = { version = "0.3", features = ["formatting"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true

[dev-dependencies]
# Drives the REAL router in tests via ServiceExt::oneshot. Needed because the auth-ordering defect
# (TG-279 follow-up) lives in axum's extractor pipeline: calling a handler function directly runs no
# extractors and cannot see it.
tower = { version = "0.5", features = ["util"] }
